}

function renderDoors(){
  const el = $('pgDoorsBody');
  const st = doorStatus(), open = st.open;

  // Paint everything shut, then let the open panels swing on the next frame, so entering the page
  // plays the movement rather than showing a car that was already hanging open.
  el.innerHTML = '<div class="topwrap" id="doorCar">' + carTop({unlocked: !!S.unlocked}) + '</div>' +
    '<div class="rowcard" id="doorRows">' + st.rows + '</div>';
  mount3d('doors', 'doorCar', 'doors', st.car);
  const paint = () => paintDoorSvg(open);
  if(REDUCED()) paint(); else requestAnimationFrame(() => requestAnimationFrame(paint));
  // remote actions, only for what vehicleControlConfig says this car has. Window state is unknown
  // on a J5, so windows are plain Close / Vent / Open rather than a toggle that guesses.
  const acts = [];
  if(!CAPS || CAPS.liftgate || CAPS.trunk)
    acts.push({ic: 'trunk', label: 'Rear trunk', btns: [
      {t: 'Open', op: '740300', ask: 'Open the rear trunk?'}, {t: 'Close', op: '740A00'}]});
  const wc = (CAPS && CAPS.windows) || {};
  const wbtns = [];
  if(wc.close) wbtns.push({t: 'Close', op: '740500'});
  if(wc.vent)  wbtns.push({t: 'Vent',  op: '740E00'});
  if(wc.open)  wbtns.push({t: 'Open',  op: '740600', ask: 'Open all windows?'});
  if(wbtns.length) acts.push({ic: 'window', label: 'Windows', btns: wbtns});
  if(CAPS && CAPS.sunroof && (CAPS.sunroof.open || CAPS.sunroof.tilt)){
    const sb = [{t: 'Close', op: '740F00'}];
    if(CAPS.sunroof.tilt) sb.push({t: 'Tilt', op: '740F02'});
    if(CAPS.sunroof.open) sb.push({t: 'Open', op: '740F01', ask: 'Open the sunroof?'});
    acts.push({ic: 'car', label: 'Sunroof', btns: sb});
  }
  if(!CAPS || CAPS.find) acts.push({ic: 'find', label: 'Find car', btns: [{t: 'Flash', op: '740400'}]});
  if(acts.length){
    const h = document.createElement('div');
    h.className = 'sech'; h.style.padding = 'var(--s5) 0 var(--s2)';
    h.innerHTML = '<span class="ov">Remote</span>';
    const card = document.createElement('div');
    card.className = 'rowcard'; card.style.margin = '0';
    acts.forEach(a => {
      const r = document.createElement('div');
      r.className = 'rrow';
      r.innerHTML = '<span class="ri">' + icon(a.ic) + '</span><span class="rl">' + a.label + '</span>';
      const box = document.createElement('div'); box.className = 'racts';
      a.btns.forEach(bt => {
        const b = document.createElement('button');
        b.textContent = bt.t;
        b.setAttribute('aria-label', a.label + ' ' + bt.t.toLowerCase());
        b.onclick = async () => {
          if(bt.ask && !(await ask(bt.ask, 'The command is sent to the car now.'))) return;
          fire(bt.op, b);
        };
        box.appendChild(b);
      });
      r.appendChild(box); card.appendChild(r);
    });
    el.appendChild(h); el.appendChild(card);
  }
  const note = document.createElement('div');
  note.className = 'note';
  note.innerHTML =
    (windowsOpen() === null
      ? 'Window position is not decoded reliably on this model yet, so that row is hidden rather ' +
        'than guessed. '
      : '') +
    'Which corner a door bit means was live-tested on an Omoda E5 and has not been cross-checked ' +
    'on this car, and the sides assume right-hand drive. If you open one door and the diagram ' +
    'lights the wrong one, that mapping is what needs fixing.';
  el.appendChild(note);
}

function renderTyres(){
  const el = $('pgTyresBody');
  const t = S.tpms || [];
  const unit = S.tyre_unit || 'psi';
  const indirect = S.tyre_indirect !== false;
  const ok = S.tyre_status === 'Normal';

  // Two honest cases. With real per-wheel sensors each tyre is coloured and labelled from its own
  // reading. With indirect TPMS the car reports ONE status for the whole vehicle, so all four are
  // drawn in the same state and the caption says so — four different colours here would be a lie.
  let wheels, vals = null, cap;
  if(indirect){
    wheels = ok ? 'ok' : 'bad';
    cap = ok
      ? 'All four reading <b>normal</b>. This car reports one status for the whole vehicle, not four pressures.'
      : 'The car is reporting <b>a problem</b> but cannot say which wheel. Check all four by hand.';
  } else {
    // the server sends "psi" in the configured display unit (psi | bar | kpa); judge in PSI, print in that unit
    const toPsi = v => unit === 'bar' ? v * 14.5038 : unit === 'kpa' ? v * .145038 : v;
    const dec = unit === 'bar' ? 1 : 0, uLabel = unit === 'kpa' ? 'kPa' : unit;
    wheels = t.map(w => { if(w.psi == null) return '';
      const p = toPsi(w.psi);
      return (p < 28 || p > 40) ? 'bad' : (p < 30 || p > 38) ? 'warn' : 'ok'; });       // bad matches the server's "Check tyres"
    vals = t.map(w => w.psi == null ? '' : w.psi.toFixed(dec) + ' ' + uLabel);
    const known = t.filter(w => w.psi != null).length;
    cap = known ? 'Live pressure from each wheel sensor.' : 'No wheel sensor has reported yet.';
  }

  el.innerHTML = '<div class="topwrap" id="tyreCar">' +
      carTop({wheels: wheels, wheelVals: vals, codes: true, unlocked: !!S.unlocked}) + '</div>' +
    '<div class="topcap">' + cap + '</div>' +
    '<div class="rowcard"><div class="row"><span class="rl">Status</span><span class="rv ' +
      (ok ? 'ok' : 'bad') + '">' +
      (ok ? CK_OK : CK_BAD) + (S.tyre_status || '—') + '</span></span></div>' +
      (S.tpms_age_min != null ? '<div class="row"><span class="rl">Last wheel frame</span>' +
        '<span class="rv">' + S.tpms_age_min + ' min ago</span></div>' : '') +
    '</div>' +
    '<div class="note">' + (indirect
      ? 'This car uses indirect TPMS: it infers a soft tyre from wheel speed rather than from pressure ' +
        'sensors, so it can only report normal or not. Per-wheel pressures appear here on cars with real ' +
        'sensors.'
      : 'Pressures from the last frame that carried live sensors.') + '</div>';
  mount3d('tyres', 'tyreCar', 'tyres', {
    wheels: Array.isArray(wheels) ? wheels : [wheels, wheels, wheels, wheels],
    values: vals || [], unlocked: !!S.unlocked}, WHEEL_POS);
}

/* Seven-day efficiency, drawn as bars rather than a line.
   A line is the wrong mark here: most weeks have days with no driving, and joining across those
   gaps invents a trend, while leaving the gaps breaks the line into stubs and orphan dots (which
   is what this looked like before). Bars degrade honestly -- a day with no driving is simply an
   empty slot, and every value gets its own label with room to breathe.
   Bars are measured from zero because they encode a magnitude; the WLTP rating is the reference
   line you actually compare against. */
function drawEnergy(hist, wltp){
  const svg = $('echart'); if(!svg) return;
  const W = 340, H = 184;
  const L = 6, R = 6, T = 30, B = 30;          // room above for value labels, below for dates
  const days = hist.length || 7;
  const vals = hist.map(h => (h.eff == null ? null : h.eff));
  const hus = hist.map(h => (h.eff_hu == null ? null : h.eff_hu));   // drops only, as the head unit counts
  const present = vals.filter(v => v != null);

  if(!present.length){
    svg.innerHTML = '<text x="' + (W / 2) + '" y="' + (H / 2) + '" text-anchor="middle" ' +
      'font-size="12" fill="var(--fnt)">No driving logged in the past 7 days</text>';
    $('eLegend').innerHTML = '';
    return;
  }

  const top = Math.max(...present, ...hus.filter(v => v != null), wltp || 0) * 1.16;
  const band = (W - L - R) / days;
  const bw = Math.min(26, band * 0.52);
  const cx = i => L + band * i + band / 2;
  const y  = v => H - B - (v / top) * (H - T - B);
  const base = H - B;

  let track = '', bars = '', labels = '', dates = '';
  hist.forEach((h, i) => {
    const v = vals[i];
    const x = cx(i) - bw / 2;
    // faint full-height track so an empty day still occupies visible space
    track += '<rect class="etrack" x="' + x.toFixed(1) + '" y="' + (T + 4) + '" width="' + bw.toFixed(1) +
      '" height="' + (base - T - 4).toFixed(1) + '" rx="' + (bw / 2.6).toFixed(1) + '"/>';
    // ghost bar behind: the same day before regen is credited (the head unit's figure)
    const hv = hus[i];
    if(v != null && hv != null && hv > v){
      const hy = y(hv);
      track += '<rect class="ebar hu" x="' + x.toFixed(1) + '" y="' + hy.toFixed(1) + '" width="' + bw.toFixed(1) +
        '" height="' + (base - hy).toFixed(1) + '" rx="' + (bw / 2.6).toFixed(1) + '"><title>' + hv +
        ' kWh/100km on the head unit (counts SoC drops only)</title></rect>';
    }
    if(v != null){
      const yy = y(v);
      bars += '<rect class="ebar" x="' + x.toFixed(1) + '" y="' + yy.toFixed(1) + '" width="' + bw.toFixed(1) +
        '" height="' + Math.max(3, base - yy).toFixed(1) + '" rx="' + (bw / 2.6).toFixed(1) + '"/>';
      const ly = (hv != null && hv > v) ? y(hv) : yy;          // clear the ghost bar too
      labels += '<text class="eval" x="' + cx(i).toFixed(1) + '" y="' + (ly - 8).toFixed(1) +
        '" text-anchor="middle">' + v + '</text>';
    }
    dates += '<text class="eday' + (v == null ? ' off' : '') + '" x="' + cx(i).toFixed(1) +
      '" y="' + (H - 10) + '" text-anchor="middle">' + (h.day || '') + '</text>';
  });

  // WLTP reference, labelled at the right edge where no bar label can reach it
  let wl = '';
  if(wltp){
    const wy = y(wltp);
    wl = '<line class="ewltp" x1="' + L + '" y1="' + wy.toFixed(1) + '" x2="' + (W - R) +
      '" y2="' + wy.toFixed(1) + '"/>' +
      '<text class="ewlbl" x="' + (W - R) + '" y="' + (wy - 6).toFixed(1) +
      '" text-anchor="end">WLTP ' + wltp + '</text>';
  }

  svg.innerHTML = track + wl + bars + labels +
    '<line class="ebase" x1="' + L + '" y1="' + base + '" x2="' + (W - R) + '" y2="' + base + '"/>' +
    dates;

  const worse = present.filter(v => wltp && v > wltp).length;
  const netKey = hus.some((v, i) => v != null && vals[i] != null && v > vals[i])
    ? '<span><i class="sw swn"></i>head unit</span>' : '';
  $('eLegend').innerHTML = wltp
    ? '<span><i class="sw"></i>kWh/100km</span>' + netKey + '<span><i class="sw d"></i>WLTP ' + wltp + '</span>' +
      '<span class="gap">' + (worse ? worse + ' of ' + present.length + ' days above rating'
                                    : 'every logged day at or under rating') + '</span>'
    : '<span><i class="sw"></i>kWh/100km</span>' + netKey;

  if(!REDUCED()){
    // grow the bars out of the baseline, left to right
    svg.querySelectorAll('.ebar').forEach((b, i) => {
      const h = +b.getAttribute('height'), yy = +b.getAttribute('y');
      b.style.transformOrigin = '0px ' + (yy + h) + 'px';
      b.style.transformBox = 'view-box';
      b.animate([{transform: 'scaleY(0)'}, {transform: 'scaleY(1)'}],
                {duration: 520, delay: 60 + i * 55, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'backwards'});
    });
    svg.querySelectorAll('.eval').forEach((t, i) =>
      t.animate([{opacity: 0}, {opacity: 1}], {duration: 260, delay: 320 + i * 55, fill: 'backwards'}));
  }
}

// charge curve (SoC% vs elapsed minutes) — same math as v1's drawCharge, instrument tokens
function drawChgCurve(s){
  const svg = $('cchart'); if(!svg) return;
  if(!s.series || s.series.length < 2){ svg.innerHTML = ''; return; }
  const W = 340, H = 160, L = 30, R = 12, T = 12, B = 24;
  const ys = s.series.map(p => p.soc), xmax = Math.max(...s.series.map(p => p.m), 1);
  let ymin = Math.max(0, Math.min(...ys) - 3), ymax = Math.min(100, Math.max(...ys) + 3);
  if(ymax - ymin < 6) ymax = Math.min(100, ymin + 6);
  const X = m => L + (m / xmax) * (W - L - R), Y = v => T + (1 - (v - ymin) / (ymax - ymin)) * (H - T - B);
  const pl = s.series.map(p => X(p.m).toFixed(1) + ',' + Y(p.soc).toFixed(1));
  let g = '';
  [ymin, (ymin + ymax) / 2, ymax].forEach(v => { const y = Y(v).toFixed(1);
    g += '<line x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y +
      '" stroke="var(--hair)" stroke-width="1"/>' +
      '<text x="' + (L - 7) + '" y="' + (+y + 3).toFixed(1) + '" text-anchor="end" font-size="9" fill="var(--fnt)">' +
      Math.round(v) + '</text>'; });
  g += '<text x="' + X(0).toFixed(1) + '" y="' + (H - 7) + '" font-size="8.5" letter-spacing="1" fill="var(--fnt)">0M</text>';
  g += '<text x="' + (W - R) + '" y="' + (H - 7) + '" text-anchor="end" font-size="8.5" letter-spacing="1" fill="var(--fnt)">' +
    Math.round(xmax) + 'M</text>';
  g += '<path d="M ' + X(0).toFixed(1) + ',' + (H - B) + ' L ' + pl.join(' L ') + ' L ' +
    X(xmax).toFixed(1) + ',' + (H - B) + ' Z" fill="var(--acc-sf)"/>';
  g += '<polyline points="' + pl.join(' ') + '" fill="none" stroke="var(--acc)" stroke-width="2" ' +
    'stroke-linejoin="round" stroke-linecap="round"/>';
  const lp = s.series[s.series.length - 1];
  g += '<circle cx="' + X(lp.m).toFixed(1) + '" cy="' + Y(lp.soc).toFixed(1) + '" r="3" fill="var(--acc)"/>';
  svg.innerHTML = g;
  drawIn(svg);
}

// ---- distance page: monthly calendar (same /api/history as v1's calendar view) ----
// Grid + month summary on top, and a card for the selected day (trips, energy, charging) below.
let calMonth = null;   // 'YYYY-MM'
let calSel = null;     // selected day of calMonth; null = newest day with activity
let distSeq = 0;       // renderDist can be entered twice (deep link + tap, fast month flips)
const MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function money(n){
  const c = S.currency || {};

function calStat(v, u){ return '<div><b class="num">' + v + '</b><span>' + u + '</span></div>'; }
function calDay(x, cy, cm){

async function renderDist(){
  const el = $('pgDistBody');
  if(!calMonth){
    const n = new Date();
    calMonth = n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0');
  }
  const mine = ++distSeq;
  const [cy, cm] = calMonth.split('-').map(Number);
  const nav = d => '<svg viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="1.9" ' +
    'stroke-linecap="round" stroke-linejoin="round"><path d="' + (d < 0 ? 'M7 1L1 7l6 6' : 'M1 1l6 6-6 6') + '"/></svg>';
  el.innerHTML = '<div class="calhead">' +
    '<button class="calnav" id="calP" aria-label="Previous month">' + nav(-1) + '</button>' +
    '<b>' + MON[cm - 1] + ' ' + cy + '</b>' +
    '<button class="calnav" id="calN" aria-label="Next month">' + nav(1) + '</button></div>' +
    '<div class="calgrid" id="calG"><div class="note" style="margin:0">Loading…</div></div>';
  $('calP').onclick = () => { shiftMonth(-1); };
  $('calN').onclick = () => { shiftMonth(1); };
  const d = await api('api/history?month=' + calMonth);
  if(mine !== distSeq) return;                     // a newer render started while this was loading
  const g = $('calG');
  const lead = (new Date(cy, cm - 1, 1).getDay() + 6) % 7;   // Monday-first
  const maxKm = Math.max(1, ...d.days.map(x => x.km));
  const active = x => x.km > 0 || x.chg_kwh > 0;
  if(calSel == null || !d.days.some(x => x.d === calSel && active(x))){
    const last = d.days.filter(active).pop();
    calSel = last ? last.d : null;
  }
  let cells = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map(x =>
    '<div class="caldow">' + x + '</div>').join('');
  for(let i = 0; i < lead; i++) cells += '<div></div>';
  d.days.forEach(x => {
    const has = x.km > 0;
    const op = has ? (0.35 + 0.65 * x.km / maxKm) : 0;
    // a day with only a charge is dim but still tappable, so its session is reachable
    cells += '<button class="calday ' + (has ? 'on' : 'off') + (!has && x.chg_kwh > 0 ? ' cg' : '') +
      (x.d === calSel ? ' sel' : '') + '" data-d="' + x.d + '">' +
      (op ? '<span class="calwash" style="opacity:' + (op * 0.16).toFixed(2) + '"></span>' : '') +
      '<span class="cd">' + x.d + '</span>' +
      '<span class="ck" style="opacity:' + (has ? 1 : 0.4) + '">' + (has ? x.km : '·') + '</span>' +
      (x.chg_kwh > 0 ? '<i class="cdot"></i>' : '') +
      '</button>';
  });
  g.innerHTML = cells;
  const t = d.totals || {};
  const per = t.days_driven ? Math.round(t.km / t.days_driven) : null;
  el.insertAdjacentHTML('beforeend',
    '<div class="caltot">' + calStat(t.km || 0, 'km driven') + calStat(t.kwh || 0, 'kWh used') +
      calStat(t.chg_kwh || 0, 'kWh charged') + '</div>' +
    '<div class="caltot mid">' + calStat(t.eff != null ? t.eff : '—', 'kWh/100km') +
      calStat(t.chg_cost ? money(t.chg_cost) : '—', 'charging cost') +
      calStat(per != null ? per : '—', 'km per driving day') + '</div>' +
    (t.regen > 0 && t.eff_hu != null ? '<div class="calnet">' + '≈' + t.regen + ' kWh back from regen · head unit shows ' +
      t.eff_hu + '</div>' : '') +
    (t.days_driven ? '<div class="calsub">' + t.days_driven + (t.days_driven === 1 ? ' day' : ' days') +
      ' driven · ' + (t.trips || 0) + (t.trips === 1 ? ' trip' : ' trips') + ' · ' +
      (t.charges || 0) + (t.charges === 1 ? ' charge' : ' charges') + '</div>' : '') +
    '<div id="calDay"></div>');
  const paint = () => {
    const x = d.days.find(v => v.d === calSel);
    $('calDay').innerHTML = x ? calDay(x, cy, cm) : '';
  };
  paint();
  g.querySelectorAll('.calday.on, .calday.cg').forEach(b => b.onclick = () => {
    calSel = Number(b.dataset.d);
    g.querySelectorAll('.calday.sel').forEach(n => n.classList.remove('sel'));
    b.classList.add('sel');
    paint();
  });
}
function shiftMonth(dir){
  const [y, m] = calMonth.split('-').map(Number);
  const n = new Date(y, m - 1 + dir, 1);
  calMonth = n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0');

}

// ---- charge calculator ----
// Same model as v1's planner, but DC efficiency follows the server's receipt-calibrated curve
// (chg_eff in tools/server.py: 0.91 up to 85%, 0.855 from 95%). AC is the onboard-charger guess.
const CP = {target: 80, mode: 'DC'};
function cpPrices(){
  let p = {}; try{ p = JSON.parse(localStorage.getItem('cpPrice') || '{}'); }catch(e){}
  return {DC: p.DC != null ? p.DC : (S.tariff || 2540), AC: p.AC != null ? p.AC : 1445};
}
function cpEff(mode, end){
  if(mode === 'AC') return 0.88;
  if(end >= 95) return 0.855;
  if(end <= 85) return 0.91;
  return 0.91 + (0.855 - 0.91) * (end - 85) / 10;
}
function renderPlan(){
  const el = $('pgPlanBody');
  const now = S.battery != null ? S.battery : 0;
  CP.target = Math.max(now, CP.target);
  el.innerHTML =

      '<div class="cpchips">' + [60, 80, 90, 100].map(v =>
        '<button data-t="' + v + '"' + (v < now ? ' disabled' : '') + '>' + v + '%</button>').join('') +
      '</div></div>' +
    '<div class="panel"><div class="cpmode"><span class="plbl">Charger</span><span class="seg">' +
      '<button data-m="DC">DC · SPKLU</button><button data-m="AC">AC · home</button></span></div>' +
      '<div class="stats">' +
        '<div><b class="num" id="cpIn"></b><span>kWh into battery</span></div>' +
        '<div><b class="num" id="cpBuy"></b><span>kWh at meter</span></div>' +
        '<div><b class="num" id="cpKm"></b><span>range added</span></div>' +
        '<div><b class="num" id="cpMin"></b><span>time</span></div></div>' +
      '<div class="cpcost"><label>' + ((S.currency && S.currency.symbol) || '') +
        ' <input id="cpP" type="number" inputmode="decimal" min="0"> / kWh</label>' +
        '<span class="pval num" id="cpCost"></span></div></div>' +
    '<div class="note" id="cpNote"></div>';
  $('cpR').oninput = ev => { CP.target = +ev.target.value; cpUpdate(); };
  el.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { CP.target = Math.max(now, +b.dataset.t); cpUpdate(); });
  el.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { CP.mode = b.dataset.m; cpUpdate(); });
  $('cpP').oninput = ev => {
    const p = cpPrices(); p[CP.mode] = +ev.target.value || 0;
    try{ localStorage.setItem('cpPrice', JSON.stringify(p)); }catch(e){}
    cpUpdate(true);
  };
  cpUpdate();
}
// fromPrice: the user is typing in the price box, so don't rewrite it under the cursor
function cpUpdate(fromPrice){
  const now = S.battery != null ? S.battery : 0, t = CP.target, D = '—';
  const cap = S.battery_kwh || 58.9;
  const ins = S.insights || {}, e = S.energy || {};
  const cons = ins.consumption != null ? ins.consumption : e.consumption;
  const eff = cpEff(CP.mode, t);
  const into = (t - now) / 100 * cap, buy = into / eff;
  const price = cpPrices()[CP.mode];
  // DC time from your own logged sessions (median avg kW); AC has no logged rate to lean on
  const kws = ((S.charging && S.charging.history) || []).map(x => x.avg_kw).filter(v => v > 0).sort((a, b) => a - b);
  const kw = CP.mode === 'DC' && kws.length ? kws[kws.length >> 1] : null;
  const pct = now >= 100 ? 100 : (t - now) / (100 - now) * 100;
  $('cpR').value = t;
  $('cpR').style.background = 'linear-gradient(90deg,var(--acc) ' + pct + '%,var(--card-2) ' + pct + '%)';
  $('cpT').textContent = t;
  document.querySelectorAll('#pgPlanBody [data-t]').forEach(b => b.classList.toggle('on', +b.dataset.t === t));
  document.querySelectorAll('#pgPlanBody [data-m]').forEach(b => b.classList.toggle('on', b.dataset.m === CP.mode));
  $('cpIn').textContent = into.toFixed(1);
  $('cpBuy').textContent = buy.toFixed(1);
  $('cpKm').textContent = cons ? '+' + Math.round(into / cons * 100) + ' km' : D;
  $('cpMin').textContent = kw && into > 0 ? '~' + Math.round(into / kw * 60) + ' min' : D;
  if(!fromPrice) $('cpP').value = price;
  $('cpCost').textContent = money(buy * price);
  $('cpNote').textContent = CP.mode === 'DC'
    ? 'DC loss rises when you charge past 85% (taper and cell balancing), so the meter reads about ' +
      Math.round((1 / eff - 1) * 100) + '% more than goes into the pack. Calibrated to real PLN Mobile receipts.' +
      (kw ? ' Time uses your median logged DC rate, ' + kw + ' kW, and stretches near 100%.' : '')
    : 'AC assumes about 12% onboard-charger loss. Set your home tariff above; it is kept on this device.' +
      ' No time estimate: the car does not report your wallbox rate.';
}

      'It starts by itself after every restart.</p>' +
      '<div class="hutags"><span class="hutag ok">Tested on a real Jaecoo J5 EV</span>' +

        'gives the ADB port back as it was. To switch it off for a while instead, use the switch at the top of the app.</li>' +
      '<li><b>In Engineering mode, only switch Enable ADB.</b> The rest are factory and test settings. Leave them as they are.</li>' +
      '<li><b>Parked, car on.</b> Never while driving. Keep the car on so the head unit does not sleep halfway.</li>' +
      '<li><b>Your own hotspot only</b> while Enable ADB is on: anyone on the same WiFi could reach the head unit. The add-on shuts that door once it runs.</li>' +

  huText();

function huProgress(){
  const d = huDone(), n = HU_ALL.filter(k => d.includes(k)).length;
  $('huPrgT').textContent = n === HU_ALL.length ? 'All done' : n + ' of ' + HU_ALL.length + ' done';
  $('huPrgB').style.width = (n / HU_ALL.length * 100) + '%';
  $('huReset').hidden = !n;
  HU_STEPS.forEach(([g, , subs]) => {
    const c = subs.filter(s => d.includes(s[0])).length, all = c === subs.length;
    const p = document.querySelector('[data-group="' + g + '"]');
    p.classList.toggle('done', all);
    p.querySelector('.hucnt').textContent = subs.length > 1 ? c + '/' + subs.length : '';
  });
}

function huText(){
  const a = HU.meta && HU.meta.addons && HU.meta.addons[0];
  const apkUrl = new URL('api/hu/apk?addon=climate-gesture', location.href).href;
  if(a && a.size) $('huSize').textContent = Math.round(a.size / 1024) + ' KB';
  else $('huSize').hidden = true;
  const H = 'android.hardware.automotive.vehicle@2.0::IVehicle/default';
  const cmds =
    '# laptop and head unit on the same hotspot, Enable ADB on\n' +
    'adb connect <head-unit-ip>:5555\n' +
    'adb shell getprop ro.build.display.id\n' +
    'adb shell lshal debug ' + H + ' --get 557847208   # must print a value\n' +
    'adb install -r climate-gesture.apk\n' +
    'adb shell appops set id.jaylabb.climategesture SYSTEM_ALERT_WINDOW allow\n' +
    'adb shell am start-foreground-service -a id.jaylabb.climategesture.OPEN_ADB -n id.jaylabb.climategesture/.GestureService\n' +
    'adb shell tail -5 /data/data/id.jaylabb.climategesture/files/log.txt   # expect "car link ok"\n\n' +
    '# undo: easiest is Remove Climate Gesture in the app. From the laptop: tap Open for 5 minutes in the app, then\n' +
    'adb connect <head-unit-ip>:5555\n' +
    'adb uninstall id.jaylabb.climategesture\n' +
    '# restart the head unit; the WiFi ADB block goes away with the app';
  $('huCmds').textContent = cmds;
  $('huPrompt').textContent =
    'Help me install the Climate Gesture add-on on my car\'s head unit (Jaecoo J5 EV, Android 12). My laptop and the ' +
    'head unit are on the same phone hotspot. "Enable ADB" is on in the head unit\'s engineering menu, so it accepts ' +
    '`adb connect <ip>:5555` without a key prompt and its adb shell runs as root.\n\n' +
    'APK: download ' + apkUrl + (a && a.sha256 ? ' (sha256 ' + a.sha256 + ')' : '') + ' and check the hash.\n\n' +
    'This is an ordinary app install: it changes no system files and no car settings, so no backup is needed. ' +
    'Before step 1, tell me in two lines what you are about to change and how to undo it (below), then wait for my OK.\n\n' +
    'Do only these steps, in order, and show me every command and its output:\n' +
    '1. Find the head unit: list the hosts on my hotspot subnet with TCP 5555 open and `adb connect` to it. ' +
    'Tell me `getprop ro.product.model` and `getprop ro.build.display.id`.\n' +
    '2. Check it is supported: `adb shell lshal debug ' + H + ' --get 557847208` must print a value. ' +
    'If it errors or prints nothing, stop and tell me the head unit is not supported.\n' +
    '3. `adb install -r climate-gesture.apk`\n' +
    '4. `adb shell appops set id.jaylabb.climategesture SYSTEM_ALERT_WINDOW allow`\n' +
    '5. `adb shell am start-foreground-service -a id.jaylabb.climategesture.OPEN_ADB -n id.jaylabb.climategesture/.GestureService`\n' +
    '6. Wait 5 seconds, then `adb shell tail -5 /data/data/id.jaylabb.climategesture/files/log.txt`. It should say "car link ok".\n\n' +
    'Hard limits: never run `lshal debug --set`, `setprop`, `settings put`, `remount`, `reboot`, or `pm uninstall`; ' +
    'never write to /system or /vendor; do not touch any other app or setting. If anything differs from what I ' +
    'described, stop and ask me before going further.\n\n' +
    'Undo, only if I ask you to remove it: the simplest is the "Remove Climate Gesture" button in the app on the head unit. ' +
    'To do it from the laptop, I first tap "Open for 5 minutes" in that app ' +
    '(the app blocks ADB over WiFi otherwise). Then `adb connect <ip>:5555`, `adb uninstall id.jaylabb.climategesture`, ' +
    'and tell me to restart the head unit. That is the only uninstall you may run.';
}

function huTool(){
  const t = $('huTool'); if(!t) return;
  const m = HU.meta;
  if(!m){ t.innerHTML = '<div class="humsg"><span class="huspin"></span> Checking this dashboard…</div>'; return; }
  if(m.demo || !m.local || !(m.networks || []).length){
    t.innerHTML = '<p>The one-tap installer works when this dashboard runs on a laptop that is on the same hotspot as the car.</p>' +
      '<div class="humsg">' + (m.demo ? 'This is the demo, so there is no head unit to reach.' :
        !m.local ? 'This browser is not on the same network as the dashboard server.' :
        'This dashboard server is not on a local network.') +
      ' Run <b>python tools/server.py</b> on your laptop and open it there, or use the AI agent prompt below.</div>';
    return;
  }
  const busy = HU.busy;
  let h = '<p>Searches ' + huEsc(m.networks.join(', ')) + ' for a head unit with Enable ADB on.</p>' +
    '<button class="bigbtn" id="huScan"' + (busy ? ' disabled' : '') + '>' +
      (busy === 'scan' ? '<span class="huspin"></span> Searching…' : 'Find head unit') + '</button>' +
    '<div class="huip"><input id="huIp" inputmode="decimal" placeholder="or type its IP, e.g. 172.20.10.3" value="' + huEsc(HU.ip) + '">' +
      '<button class="hubtn2" id="huGo"' + (busy ? ' disabled' : '') + '>Check</button></div>';
  if(HU.scan){
    const f = HU.scan.found || [];
    h += f.length ? '<div class="hulist">' + f.map(d =>
        '<button data-ip="' + huEsc(d.ip) + '"' + (d.ip === HU.ip ? ' class="on"' : '') + '><span class="rl">' +
        huEsc(d.model || d.device || 'Android device') + '<small>' + huEsc(d.ip) + (d.error ? ' · ' + huEsc(d.error) : '') +
        '</small></span>' + CHEV + '</button>').join('') + '</div>'
      : '<div class="humsg bad">No head unit found. Check that Enable ADB is on and the head unit is on the same hotspot, ' +
        'then try again. If the add-on is already installed, tap Open for 5 minutes in its app first.</div>';
  }
  const p = HU.probe;
  if(p){
    h += '<dl class="hukv"><dt>Device</dt><dd>' + huEsc(p.model || p.device) + '</dd>' +
      '<dt>Software</dt><dd>' + huEsc(p.build) + '</dd><dt>Android</dt><dd>' + huEsc(p.android) + '</dd>' +
      '<dt>A/C access</dt><dd>' + (p.compatible ? CK_OK + 'works</span>' : 'not found') + '</dd>' +
      '<dt>Climate Gesture</dt><dd>' + (p.installed ? 'v' + huEsc(p.installed) + (p.running ? ', running' : ', stopped') : 'not installed') + '</dd></dl>';
    h += p.compatible
      ? '<button class="bigbtn" id="huInst"' + (busy ? ' disabled' : '') + '>' +
          (busy === 'install' ? '<span class="huspin"></span> Installing…' : (p.installed ? 'Update Climate Gesture' : 'Install Climate Gesture')) + '</button>'
      : '<div class="humsg bad">This head unit does not expose the A/C the way the J5 does, so the installer stops here. ' +
        'Nothing was changed.</div>';
  }
  if(HU.steps){
    const L = {check: 'Check head unit', upload: 'Upload', install: 'Install', start: 'Start', verify: 'Talk to the A/C', root: 'Root shell', apk: 'APK'};
    h += '<ul class="huprog">' + HU.steps.map(s => '<li' + (s.ok ? '' : ' class="bad"') + '>' + (s.ok ? CK_OK : CK_BAD) + '</span>' +
      '<span class="d"><b>' + (L[s.step] || huEsc(s.step)) + '</b>' + (s.step === 'verify' || !s.detail ? '' : ' · ' + huEsc(s.detail)) +
      '</span></li>').join('') + '</ul>';
  }
  if(HU.msg) h += '<div class="humsg' + (HU.bad ? ' bad' : ' ok') + '">' + huEsc(HU.msg) + '</div>';
  t.innerHTML = h;

  const ipIn = $('huIp');
  ipIn.oninput = () => HU.ip = ipIn.value.trim();
  $('huScan').onclick = () => huRun('scan');
  $('huGo').onclick = () => { HU.ip = ipIn.value.trim(); if(HU.ip) huRun('probe'); };
  ipIn.onkeydown = ev => { if(ev.key === 'Enter') $('huGo').click(); };
  t.querySelectorAll('[data-ip]').forEach(b => b.onclick = () => { HU.ip = b.dataset.ip; huRun('probe'); });
  if($('huInst')) $('huInst').onclick = () => huRun('install');
}

async function huRun(action){
  if(HU.busy) return;
  HU.busy = action; HU.msg = ''; HU.bad = false;
  if(action !== 'install') HU.steps = null;
  if(action === 'scan') HU.probe = null;
  if(action === 'probe') HU.probe = null;
  huTool();
  try{
    const d = await huPost(action, {ip: HU.ip, addon: 'climate-gesture'});
    if(action === 'scan'){
      HU.scan = d.ok ? d : {found: []};
      if(!d.ok){ HU.msg = d.error || 'Search failed'; HU.bad = true; }
      const j = (HU.scan.found || []).filter(x => !x.error);
      if(d.ok && j.length === 1){ HU.ip = j[0].ip; HU.busy = ''; return huRun('probe'); }
    } else if(action === 'probe'){
      if(d.ok) HU.probe = d; else { HU.msg = d.error || 'Could not reach that IP'; HU.bad = true; }
    } else {
      HU.steps = d.steps || null;
      if(d.ok){
        HU.msg = 'Installed. Try two fingers on the head unit screen.'; huSetDone('4.1', true);
        const p = document.querySelector('[data-step="4.1"]');
        if(p){ p.classList.add('done'); const b = p.querySelector('.huck'); b.classList.add('on'); b.setAttribute('aria-pressed', true); huProgress(); }
        const q = await huPost('probe', {ip: HU.ip, addon: 'climate-gesture'}).catch(() => null);
        if(q && q.ok) HU.probe = q;
      } else { HU.msg = d.error || 'Install stopped. See the step that failed above.'; HU.bad = true; }
    }
  }catch(e){
    if(e === 0) return;
    HU.msg = 'The dashboard server did not answer.'; HU.bad = true;
  }
  HU.busy = '';
  huTool();
}

// ---- navigation: two tabs + right-slide pages, now with back gesture and history ----
const PAGES = {ac: ['pgAc', renderAc], doors: ['pgDoors', renderDoors],
               tyres: ['pgTyres', renderTyres], energy: ['pgEnergy', renderEnergy],
               batt: ['pgBatt', renderBatt], chg: ['pgChg', renderChg],
               dist: ['pgDist', renderDist], flex: ['pgFlex', renderFlex],
               plan: ['pgPlan', renderPlan], hu: ['pgHu', renderHu]};
let openKey = null;

function openPage(k, fromHistory){
  const p = PAGES[k]; if(!p) return;
  if(k === 'ac' && CAPS && CAPS.ac && CAPS.ac.min != null)
    acTarget = Math.min(Math.max(acTarget, Math.ceil(CAPS.ac.min)), Math.floor(CAPS.ac.max));
  p[1]();
  const el = $(p[0]);
  el.scrollTop = 0;
  el.classList.add('open');
  // the page slides in; its contents rise a beat behind it so the two read as one move
  stagger([...el.querySelectorAll('.pbody > *')], 30, 150);
  openKey = k;
  if(!fromHistory) history.pushState({page: k}, '', '#' + k);
}
function closePage(fromHistory){
  if(!openKey) return;
  $(PAGES[openKey][0]).classList.remove('open');
  openKey = null;
  if(!fromHistory) history.back();
}
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => closePage());
window.addEventListener('popstate', ev => {
  const k = ev.state && ev.state.page;
  if(openKey && openKey !== k) closePage(true);
  if(k && k !== openKey) openPage(k, true);
});
document.addEventListener('keydown', ev => {
  if(ev.key !== 'Escape') return;
  if($('sheet').classList.contains('show')) askClose(false);
  else if(openKey) closePage();
});

// edge-swipe back on detail pages
(function(){
  let sx = 0, sy = 0, dragging = false, el = null, w = 0;
  document.addEventListener('touchstart', ev => {
    if(!openKey || ev.touches.length !== 1) return;
    const t = ev.touches[0];
    if(t.clientX > 30) return;
    el = $(PAGES[openKey][0]); w = el.offsetWidth || 430;
    sx = t.clientX; sy = t.clientY; dragging = true;
  }, {passive: true});
  document.addEventListener('touchmove', ev => {
    if(!dragging) return;
    const t = ev.touches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if(Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 14){ dragging = false; el.classList.remove('drag');
      el.style.transform = ''; return; }
    if(dx <= 0) return;
    el.classList.add('drag');
    el.style.transform = 'translate3d(' + dx + 'px,0,0)';
  }, {passive: true});
  document.addEventListener('touchend', ev => {
    if(!dragging) return;
    dragging = false;
    const dx = (ev.changedTouches[0].clientX - sx);
    el.classList.remove('drag');
    el.style.transform = '';
    if(dx > w * 0.32) closePage();
  }, {passive: true});
})();

document.querySelectorAll('.tabbar button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabbar button').forEach(x => x.classList.toggle('on', x === b));
  const home = b.dataset.v === 'home';
  const shown = home ? $('viewHome') : $('viewAcct');
  $('viewHome').hidden = !home; $('viewAcct').hidden = home;
  if(!home && !S._acctDone){ renderAcct(); S._acctDone = true; }
  shown.classList.remove('fadein'); void shown.offsetWidth; shown.classList.add('fadein');
  window.scrollTo(0, 0);
});

// ---- data ----
// login guard banner: say why the car stopped updating, and let the owner retry once on purpose.
// Never retried automatically on page load: every refresh/tab would cost a CarLinko login.
let guardBusy = false, guardMsg = '';
function guardBanner(el, g, reload){
  el.textContent = (g.blocked
      ? 'CarLinko rejected the login for this account, so updates are paused to protect it (' + (g.reason || 'unknown') + '). '
      : 'CarLinko login failed, so it is waiting before the next automatic try (' + Math.max(1, Math.ceil((g.wait || 0) / 60)) + ' min). ')
    + (guardMsg ? guardMsg + ' ' : '');
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = guardBusy ? 'Trying…' : 'Try now'; b.disabled = guardBusy;
  b.style.cssText = 'font:inherit;font-weight:600;padding:3px 10px;margin-right:8px;border-radius:6px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer';
  b.onclick = async () => {
    guardBusy = true; guardMsg = ''; guardBanner(el, g, reload);
    try{
      const r = await (await fetch('api/relogin', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'})).json();
      guardMsg = r.ok ? 'Logged in again, reconnecting…' : (r.error || 'Login failed.');
    }catch(e){ guardMsg = 'Could not reach the dashboard.'; }
    guardBusy = false; reload();
  };
  const a = document.createElement('a');
  a.href = 'login.html?relogin'; a.textContent = 'Log in again'; a.style.color = 'inherit';
  el.append(b, a);
}
function renderGuard(){                // auto-login backed off or stopped: say so instead of going quietly stale
  const el = $('loginGuard'), g = S && S.login_guard;
  if(!el) return;
  if(!g){ el.hidden = true; guardMsg = ''; return; }
  el.style.borderLeftColor = g.blocked ? 'var(--bad)' : 'var(--warn)';
  guardBanner(el, g, load);
  el.hidden = false;
}
function renderAll(forceAc){
  const acct = S && S._acctDone;
  renderGuard();
  renderHero(); renderQA(); renderCharging(); renderCards();
  if(acct) renderAcct();
  if(openKey === 'doors') liveDoors();
  if(openKey === 'ac' && (forceAc || acSig() !== acShown)) renderAc();   // only on a real change: a redraw restarts the airflow loop
  document.body.classList.remove('loading');
  $('qaRow').removeAttribute('aria-busy');
  $('cardGrid').removeAttribute('aria-hidden'); $('rowsHost').removeAttribute('aria-hidden');
}
function take(next){                  // new summary in; keep per-session view flags (_acctDone, _painted)
  if(S) for(const k in S) if(k[0] === '_' && !(k in next)) next[k] = S[k];
  S = next;
}
async function load(){
  try{ take(await api('api/summary')); renderAll(); }
  catch(e){ /* auth redirect handled in api() */ }
}

// ---- realtime: the server pushes a summary every time the car sends a frame ----
let es = null, lastPush = 0;
const liveOk = () => es && es.readyState === 1 && Date.now() - lastPush < 45000;
function live(){
  if(!window.EventSource || es) return;
  es = new EventSource('api/stream');
  es.onmessage = ev => {
    lastPush = Date.now();
    try{ take(JSON.parse(ev.data)); renderAll(); }catch(e){}
  };
  es.onerror = () => {                // the browser retries on its own; a 401 means the session ended
    if(es.readyState === 2){ es = null; setTimeout(live, 5000); }
  };
}
document.addEventListener('visibilitychange', () => {
  // phones freeze background tabs; reopen the stream on return instead of trusting a dead socket
  if(document.hidden){ if(es){ es.close(); es = null; } }
  else { load(); live(); }
});

$('hRefresh').onclick = async () => {
  const b = $('hRefresh'); b.classList.add('spin');
  // api/refresh pokes the car and answers with the fresh summary, so no second load() round trip
  try{ take(await api('api/refresh')); renderAll(true); }
  catch(e){ await load(); }
  b.classList.remove('spin');
};
$('aEye').onclick = () => { vinShown = !vinShown; renderAcct(); };

(async () => {
  // caps and the summary in parallel: the skeleton is up until the first paint
  const caps = api('api/controls').then(r => r.caps).catch(() => null);
  const first = api('api/summary').catch(() => null);
  CAPS = await caps;
  const s0 = await first;
  if(s0){ take(s0); renderAll(); } else await load();
  live();
  // first paint only: the instrument comes up top-down, then the actions
  stagger([$('hModel').parentNode, $('hRange').parentNode, document.querySelector('.hlbl'),
           document.querySelector('.hmeta'), $('hCar')], 40, 0);
  stagger([...$('qaRow').children], 40, 200);
  const h = location.hash.slice(1);
  if(PAGES[h]) openPage(h);           // deep link: v2.html#doors / #tyres / #energy / #ac
  if(h === 'acct') document.querySelector('.tabbar button[data-v="acct"]').click();
  // Fallback only: while the stream is live it carries every change. Without it (old browser,
  // proxy dropped it) poll 15 s on home, 4 s on Doors and Climate.
  let lastLoad = Date.now();
  setInterval(() => {
    if(document.hidden || liveOk()) return;
    const every = (openKey === 'doors' || openKey === 'ac') ? 4000 : 15000;
    if(Date.now() - lastLoad >= every){ lastLoad = Date.now(); load(); }
  }, 1000);
})();
</script>
