<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1012" id="themeColor">
<title>My Vehicle</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  /* ================= BYD-GRAMMAR PORCELAIN =================
     Owner-pinned reference world: the BYD Auto app (Seal 5 / Sealion 7). Cool blue-grey
     gradient hero owning the top of the screen, the car's own render as the subject, a huge
     centred range numeral, white elevated cards on a porcelain ground, round quick actions
     floating on the hero seam. Adaptive: the same grammar rendered in a deep blue-grey at
     night, because this is a phone that gets opened in the dark. */
  :root{
    --bg:      oklch(0.963 0.006 250);   /* porcelain ground */
    --card:    oklch(1 0 0);
    --card-2:  oklch(0.978 0.004 250);
    --ink:     oklch(0.25 0.020 260);
    --mut:     oklch(0.46 0.016 260);    /* ~5.2:1 on porcelain */
    --fnt:     oklch(0.50 0.014 260);    /* ~4.6:1 on porcelain */
    --line:    oklch(0.915 0.006 250);
    --acc:     oklch(0.55 0.11 165);     /* product green: battery, good, charging */
    --acc-ink: oklch(0.47 0.11 165);     /* accent as body-size text */
    --acc-sf:  oklch(0.55 0.11 165 / .13);
    --blue:    oklch(0.56 0.13 250);     /* fuel bar on a PHEV, A/C active */
    --blue-sf: oklch(0.56 0.13 250 / .13);
    --warn:    oklch(0.62 0.14 68);
    --bad:     oklch(0.54 0.18 27);
    --heroA:   oklch(0.885 0.028 245);   /* steel-blue top of the hero */
    --heroB:   oklch(0.963 0.006 250);   /* melts into the ground */
    --btn:     oklch(0.27 0.02 260);     /* charcoal primary */
    --btn-ink: oklch(0.99 0 0);
    --sh-1:    0 1px 3px oklch(0.30 0.03 250 / .06), 0 6px 16px oklch(0.30 0.03 250 / .05);
    --sh-2:    0 2px 6px oklch(0.30 0.03 250 / .08), 0 12px 28px oklch(0.30 0.03 250 / .10);
    --scrim:   oklch(0.25 0.02 260 / .36);

    --r1:10px; --r2:14px; --r3:18px; --r4:24px; --rf:999px;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:22px; --s6:30px; --s7:44px;
    --pad:18px;
    --eo: cubic-bezier(.16,1,.3,1);
    --t-fast:140ms; --t-mid:220ms; --t-slow:340ms;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:      oklch(0.175 0.014 255);
      --card:    oklch(0.232 0.016 255);
      --card-2:  oklch(0.262 0.016 255);
      --ink:     oklch(0.960 0.004 250);
      --mut:     oklch(0.750 0.010 255);
      --fnt:     oklch(0.625 0.012 255);
      --line:    oklch(0.315 0.014 255);
      --acc:     oklch(0.760 0.140 165);
      --acc-ink: oklch(0.790 0.135 165);
      --acc-sf:  oklch(0.760 0.140 165 / .16);
      --blue:    oklch(0.740 0.125 250);
      --blue-sf: oklch(0.740 0.125 250 / .16);
      --warn:    oklch(0.800 0.130 72);
      --bad:     oklch(0.690 0.170 25);
      --heroA:   oklch(0.300 0.035 250);
      --heroB:   oklch(0.175 0.014 255);
      --btn:     oklch(0.955 0.004 250);
      --btn-ink: oklch(0.175 0.014 255);
      --sh-1:    0 1px 3px oklch(0 0 0 / .30), 0 6px 16px oklch(0 0 0 / .24);
      --sh-2:    0 2px 6px oklch(0 0 0 / .36), 0 12px 28px oklch(0 0 0 / .34);
      --scrim:   oklch(0 0 0 / .55);
    }
  }
  :root[data-theme="dark"]{
    --bg:      oklch(0.175 0.014 255);
    --card:    oklch(0.232 0.016 255);
    --card-2:  oklch(0.262 0.016 255);
    --ink:     oklch(0.960 0.004 250);
    --mut:     oklch(0.750 0.010 255);
    --fnt:     oklch(0.625 0.012 255);
    --line:    oklch(0.315 0.014 255);
    --acc:     oklch(0.760 0.140 165);
    --acc-ink: oklch(0.790 0.135 165);
    --acc-sf:  oklch(0.760 0.140 165 / .16);
    --blue:    oklch(0.740 0.125 250);
    --blue-sf: oklch(0.740 0.125 250 / .16);
    --warn:    oklch(0.800 0.130 72);
    --bad:     oklch(0.690 0.170 25);
    --heroA:   oklch(0.300 0.035 250);
    --heroB:   oklch(0.175 0.014 255);
    --btn:     oklch(0.955 0.004 250);
    --btn-ink: oklch(0.175 0.014 255);
    --sh-1:    0 1px 3px oklch(0 0 0 / .30), 0 6px 16px oklch(0 0 0 / .24);
    --sh-2:    0 2px 6px oklch(0 0 0 / .36), 0 12px 28px oklch(0 0 0 / .34);
    --scrim:   oklch(0 0 0 / .55);
  }

  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg);color-scheme:light dark}
  body{font:400 15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text",Inter,system-ui,sans-serif;
    color:var(--ink);background:var(--bg);max-width:430px;margin:0 auto;
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;-webkit-touch-callout:none;
    padding-bottom:calc(74px + env(safe-area-inset-bottom))}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;
    user-select:none;-webkit-user-select:none}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  :focus{outline:none}
  :focus-visible{outline:2px solid var(--acc-ink);outline-offset:2px;border-radius:var(--r1)}
  [hidden]{display:none!important}
  @media (prefers-reduced-motion:reduce){
    *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;
      transition-duration:.01ms!important}
  }

  /* ---------- hero ---------- */
  .hero{position:relative;padding:max(var(--s4),calc(env(safe-area-inset-top) + 6px)) var(--pad) 0;
    background:linear-gradient(180deg,var(--heroA) 0%,var(--heroB) 72%);overflow:hidden}
  .hbar{display:flex;align-items:flex-start;gap:var(--s3)}
  .hbar .hname{flex:1;min-width:0}
  .hname .hm{font-size:17px;font-weight:750;letter-spacing:.01em;display:block;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hname .hs{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:11.5px;color:var(--mut)}
  .hname .hs .dot{width:6px;height:6px;border-radius:50%;background:var(--fnt);flex:none;position:relative}
  .hname .hs .dot.on{background:var(--acc);box-shadow:0 0 0 3px var(--acc-sf)}
  .rf{width:28px;height:28px;flex:none;margin:-2px -4px 0 0;display:flex;align-items:center;
    justify-content:center;color:var(--mut);transition:transform var(--t-fast) var(--eo)}
  .rf:active{transform:scale(.85)}
  .rf svg{width:15px;height:15px}
  .rf.spin svg{animation:spin .8s var(--eo)}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* the range numeral is the hero, dead centre, like the Seal 5 screen */
  .hrange{text-align:center;margin-top:var(--s5);line-height:.88}
  .hrange b{font-size:74px;font-weight:750;letter-spacing:-.035em;font-variant-numeric:tabular-nums;
    user-select:text;-webkit-user-select:text}
  .hrange u{font-size:19px;font-weight:650;text-decoration:none;color:var(--mut);
    vertical-align:super;margin-left:3px}

  /* battery bar, plus a fuel bar only when the car actually reports a tank */
  .bars{display:flex;justify-content:center;gap:var(--s5);margin-top:var(--s4);padding:0 var(--s2)}
  .bar{display:flex;align-items:center;gap:7px;min-width:0}
  .bar svg{width:15px;height:15px;flex:none}
  .bar .tr{width:62px;height:5px;border-radius:var(--rf);background:oklch(0.5 0 0 / .16);overflow:hidden}
  .bar .tr i{display:block;height:100%;border-radius:var(--rf);transition:width .9s var(--eo)}
  .bar .pc{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--mut)}
  .bar.ev svg,.bar.ev .pc{color:var(--acc-ink)} .bar.ev .tr i{background:var(--acc)}
  .bar.fu svg,.bar.fu .pc{color:var(--blue)}    .bar.fu .tr i{background:var(--blue)}

  /* ---- charging view -----------------------------------------------------------
     While charging, the hero swaps from the three-quarter render to a photo of this car
     actually plugged in, because the charge port sits on the front-left corner and is not
     visible on the three-quarter render.
     Earlier attempts removed that photo's studio background in code and all failed: the
     backdrop measures 196 mean luminance against the bonnet's 198, so no tone threshold
     separates them; the backdrop carries a gradient, so a local-variance mask marked 67% of
     the frame as structure; feathering floated a lit rectangle over the dark theme; and a
     hand-traced polygon left grey slabs around the mirrors, because straight segments cannot
     follow a car's curves. The owner cut it out properly in an image tool instead, which is
     why this now works on both themes with no per-theme variant at all.
     The green line is traced onto the photograph's own cable, found by detecting the dark
     opaque pixels rather than by eye. It runs the cable's whole length -- from the nozzle
     holster on the post, down the slack loop at its left, along the ground, up and into the
     port -- and deliberately STARTS at the charger, so the pulse reads as energy flowing into
     the car. Two earlier attempts got this wrong: one traced only the slack loop, so both ends
     sat near the port and it looked like a glowing noose attached to nothing, and one stopped
     at the post's base, and a third stopped halfway up the post. The cable leaves the
     holster at (33,80) in this viewBox -- read off the pixel runs, not guessed.
     Gated on the model: this is a photograph of a J5, so a Tiggo or an Omoda running the same
     dashboard keeps its own render and gets the charging pill instead. The filename carries the
     model for the same reason.
     Append ?cable=1 to preview without waiting for a real session. */
  .carwrap{position:relative;width:100%;max-width:330px;margin:var(--s2) auto 0}
  .chgshot{display:none;position:relative;width:100%;aspect-ratio:356/211;
    background:url(car-charging-j5.png) center/contain no-repeat}
  .carwrap.charging .hcar{display:none}
  .carwrap.charging .chgshot{display:block;animation:fadein var(--t-slow) var(--eo)}
  .cable{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .cable path{fill:none;stroke-linecap:round}
  .cglow{stroke:var(--acc);stroke-width:7;opacity:.15;filter:blur(3px)}
  .ctrace{stroke:var(--acc);stroke-width:2.6;opacity:.48}
  .cpulse{stroke:oklch(0.97 0.05 165);stroke-width:2;stroke-dasharray:9 64;opacity:.8;
    animation:flow 2s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-73}}
  .pgled{fill:var(--acc);opacity:.85}
  .pgring{fill:none;stroke:var(--acc);stroke-width:1.6;transform-box:view-box;
    transform-origin:87px 90px;animation:plugping 2.4s var(--eo) infinite}
  @keyframes plugping{0%{transform:scale(1);opacity:.85}70%,100%{transform:scale(3.2);opacity:0}}

  .hcar{display:block;width:100%;
    filter:drop-shadow(0 16px 20px oklch(0.30 0.03 250 / .20))}

  /* quick actions float on the seam between hero and ground */
  .qa{position:relative;z-index:2;display:flex;justify-content:center;gap:var(--s5);
    margin:-26px 0 0;padding:0 var(--pad)}
  .qa button{display:flex;flex-direction:column;align-items:center;gap:7px;
    font-size:10.5px;font-weight:600;color:var(--mut);transition:color var(--t-mid) linear,opacity var(--t-mid) linear}
  .qa .qc{width:54px;height:54px;border-radius:50%;background:var(--card);color:var(--ink);
    display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-1);
    transition:transform var(--t-fast) var(--eo),color var(--t-mid) linear,box-shadow var(--t-mid) linear}
  .qa button:active .qc{transform:scale(.9)}
  .qa button.busy{opacity:.4;pointer-events:none}
  .qa button.on{color:var(--acc-ink)}
  .qa button.on .qc{color:var(--acc-ink);box-shadow:0 2px 6px var(--acc-sf),0 10px 24px var(--acc-sf)}
  .qa svg{width:23px;height:23px}

  /* live charging pill */
  .chg{display:flex;align-items:center;gap:8px;margin:var(--s4) var(--pad) 0;padding:13px var(--s4);
    background:var(--card);border-radius:var(--r2);box-shadow:var(--sh-1);
    font-size:13.5px;font-weight:650}
  .chg svg{width:15px;height:15px;flex:none;color:var(--acc-ink);animation:breathe 2.6s ease-in-out infinite}
  .chg .dim{margin-left:auto;color:var(--mut);font-weight:600;font-size:12.5px;
    font-variant-numeric:tabular-nums}

  /* ---------- card grid ---------- */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);padding:var(--s5) var(--pad) 0}
  .card{background:var(--card);border-radius:var(--r3);padding:var(--s4);min-height:94px;
    box-shadow:var(--sh-1);text-align:left;color:inherit;display:block;position:relative;
    transition:transform var(--t-fast) var(--eo)}
  button.card:active{transform:scale(.975)}
  .card .ci{width:26px;height:26px;color:var(--mut);display:block;margin-bottom:var(--s2)}
  .card .ci svg{width:100%;height:100%}
  .card .t{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.005em;line-height:1.25}
  .card .s{display:block;font-size:12px;color:var(--fnt);margin-top:4px;line-height:1.35;
    transition:color 620ms linear}
  .card .s.ok{color:var(--acc-ink)} .card .s.warn{color:var(--warn)} .card .s.bad{color:var(--bad)}
  .card .s.flash{color:var(--acc-ink);transition:color 90ms linear}
  .card.wide{grid-column:1/-1}
  .card .chv{position:absolute;top:var(--s4);right:var(--s4);width:7px;height:12px;color:var(--fnt);opacity:.5}

  /* A/C card carries its own stepper, like the BYD climate tile */
  .clim{display:flex;flex-direction:column;justify-content:space-between;min-height:132px;cursor:pointer}
  .clim .cr{display:flex;align-items:center;justify-content:space-between}
  .clim .temp{font-size:28px;font-weight:750;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .step{width:32px;height:32px;flex:none;border-radius:50%;background:var(--card-2);color:var(--ink);
    font-size:18px;font-weight:500;line-height:1;display:flex;align-items:center;justify-content:center;
    transition:transform var(--t-fast) var(--eo),background var(--t-mid) linear}
  .step:active{transform:scale(.88);background:var(--acc-sf)}
  .step:disabled{opacity:.3}
  .clim .cb{width:38px;height:38px;border-radius:50%;background:var(--card-2);color:var(--mut);
    display:flex;align-items:center;justify-content:center;flex:none}
  .clim .cb.on{background:var(--blue-sf);color:var(--blue)}
  .clim .cb svg{width:20px;height:20px}

  /* full-width list rows, the lower half of the BYD home screen */
  .rowcard{background:var(--card);border-radius:var(--r3);box-shadow:var(--sh-1);overflow:hidden;
    margin:var(--s3) var(--pad) 0}
  .row{display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;color:inherit;
    padding:15px var(--s4);min-height:60px;transition:background var(--t-fast) linear}
  .row+.row{border-top:1px solid var(--line)}
  button.row:active{background:var(--card-2)}
  .row .ri{width:22px;height:22px;flex:none;color:var(--mut)}
  .row .ri svg{width:100%;height:100%;display:block}
  .row .rl{flex:1;min-width:0;font-size:14.5px;font-weight:650;letter-spacing:-.005em}
  .row .rl small{display:block;font-size:12px;font-weight:400;color:var(--fnt);margin-top:3px}
  .row .rv{font-size:13px;font-weight:650;color:var(--mut);text-align:right;
    font-variant-numeric:tabular-nums;transition:color 620ms linear}
  .row .rv.ok{color:var(--acc-ink)} .row .rv.warn{color:var(--warn)} .row .rv.bad{color:var(--bad)}
  .row .rv.flash{color:var(--acc-ink);transition:color 90ms linear}
  .row .ch{flex:none;width:7px;height:12px;color:var(--fnt);opacity:.5}
  .sec{padding:0 var(--pad)}
  .sech{padding:var(--s5) var(--pad) 0}
  .sech .ov{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fnt)}

  /* ---------- bottom tabs ---------- */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;max-width:430px;margin:0 auto;
    background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  @supports (backdrop-filter:blur(1px)){
    .tabbar{background:color-mix(in oklab,var(--card) 86%,transparent);
      -webkit-backdrop-filter:saturate(1.5) blur(20px);backdrop-filter:saturate(1.5) blur(20px)}
  }
  .tabbar button{flex:1;padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--fnt);transition:color var(--t-mid) linear,transform var(--t-fast) var(--eo)}
  .tabbar button:active{transform:scale(.94)}
  .tabbar button.on{color:var(--ink)}
  .tabbar svg{width:23px;height:23px;transition:transform var(--t-mid) var(--eo)}
  .tabbar button.on svg{transform:translateY(-1px)}
  .tabbar span{font-size:10.5px;font-weight:650}

  /* ---------- detail page (slide-over) ---------- */
  .page{position:fixed;inset:0;z-index:60;background:var(--bg);max-width:430px;margin:0 auto;
    transform:translate3d(100%,0,0);visibility:hidden;
    transition:transform var(--t-slow) var(--eo),visibility 0s linear var(--t-slow);
    overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding-bottom:calc(var(--s7) + env(safe-area-inset-bottom))}
  .page.open{transform:none;visibility:visible;transition:transform var(--t-slow) var(--eo),visibility 0s}
  .page.drag{transition:none}
  .phead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:var(--s2);
    padding:max(var(--s4),calc(env(safe-area-inset-top) + 6px)) var(--pad) var(--s3);
    background:var(--bg)}
  @supports (backdrop-filter:blur(1px)){
    .phead{background:color-mix(in oklab,var(--bg) 84%,transparent);
      -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
  }
  .phead h2{flex:1;text-align:center;font-size:16px;font-weight:700;margin-right:36px}
  .pback{width:32px;height:32px;margin-left:-8px;flex:none;display:flex;align-items:center;
    justify-content:center;color:var(--ink);transition:transform var(--t-fast) var(--eo)}
  .pback:active{transform:translateX(-2px)}
  .pback svg{width:10px;height:17px}
  .pbody{padding:var(--s2) var(--pad) 0}
  .pbody .rowcard{margin-left:0;margin-right:0}

  /* white card used by charts and figures on detail pages */
  .panel{background:var(--card);border-radius:var(--r3);padding:var(--s5) var(--s4);
    box-shadow:var(--sh-1)}
  .panel+.panel{margin-top:var(--s3)}
  .plbl{font-size:12.5px;color:var(--mut);font-weight:600}
  .pval{font-size:38px;font-weight:750;letter-spacing:-.03em;line-height:1;margin-top:8px;
    font-variant-numeric:tabular-nums}
  .pval .u{font-size:14px;font-weight:650;color:var(--mut);letter-spacing:0;margin-left:5px}
  .stats{display:flex;gap:var(--s5);margin-top:var(--s4);padding-top:var(--s3);
    border-top:1px solid var(--line)}
  .stats>div{min-width:0}
  .stats b{display:block;font-size:16.5px;font-weight:750;letter-spacing:-.015em;
    font-variant-numeric:tabular-nums}
  .stats span{display:block;font-size:10.5px;color:var(--fnt);margin-top:3px}
  .note{font-size:12.5px;line-height:1.6;color:var(--fnt);margin-top:var(--s4);padding:0 2px;
    user-select:text;-webkit-user-select:text}

  /* top-view diagram, shared by Doors and Tyres */
  .topwrap{position:relative;width:228px;margin:var(--s3) auto var(--s3)}
  .topwrap svg{width:100%;display:block;overflow:visible}
  .wh{fill:var(--card-2);stroke:var(--line);stroke-width:1.4}
  .wh.ok{fill:var(--acc-sf);stroke:var(--acc);stroke-width:1.8}
  .wh.warn{fill:oklch(0.7 0.14 70 / .16);stroke:var(--warn);stroke-width:1.8}
  .wh.bad{fill:oklch(0.6 0.18 27 / .16);stroke:var(--bad);stroke-width:1.8}
  .whc{fill:var(--fnt);font-size:7.5px;font-weight:600;letter-spacing:.12em}
  .whv{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;fill:var(--mut)}
  .whv.ok{fill:var(--acc-ink)} .whv.warn{fill:var(--warn)} .whv.bad{fill:var(--bad)}
  .cbody{fill:var(--card);stroke:var(--line);stroke-width:1.6}
  .cglass,.croof{fill:var(--card-2);stroke:var(--line);stroke-width:1}
  .cmir{fill:var(--line)}
  .chole{fill:var(--bg);opacity:0;transition:opacity 300ms linear}
  .chole.on{opacity:1}
  .cdoor,.clid,.csun{transform-box:view-box;fill:var(--card-2);stroke:var(--line);stroke-width:1.3;
    transition:transform 520ms var(--eo),fill 320ms linear,stroke 320ms linear}
  .cdoor.open,.clid.open,.csun.open{fill:oklch(0.62 0.18 27 / .18);stroke:var(--bad);stroke-width:1.7}
  .cdoor.l.open{transform:rotate(-34deg)}
  .cdoor.r.open{transform:rotate(34deg)}
  .clid.open{transform:scaleY(.3)}
  .csun.open{transform:scaleY(.16)}
  .clockg{transition:color 320ms linear;color:var(--acc)}
  .clockg.un{color:var(--warn)}
  .topcap{text-align:center;font-size:12px;line-height:1.5;color:var(--fnt);
    margin:0 auto var(--s4);max-width:290px}
  .topcap b{color:var(--mut);font-weight:650}
  /* remote actions on the Doors page: one row per part, small pill buttons on the right */
  .rrow{display:flex;align-items:center;gap:var(--s3);padding:12px var(--s4);min-height:56px}
  .rrow+.rrow{border-top:1px solid var(--line)}
  .rrow .ri{width:22px;height:22px;flex:none;color:var(--mut)}
  .rrow .ri svg{width:100%;height:100%;display:block}
  .rrow .rl{flex:1;min-width:0;font-size:14.5px;font-weight:650}
  .racts{display:flex;gap:var(--s2);flex:none}
  .racts button{padding:8px 13px;border-radius:var(--rf);background:var(--card-2);color:var(--ink);
    font-size:12.5px;font-weight:700;transition:transform var(--t-fast) var(--eo),opacity var(--t-mid) linear}
  .racts button:active{transform:scale(.93)}
  .racts button.busy{opacity:.4;pointer-events:none}
  /* low-poly 3D car (car3d.js). Replaces the flat diagram when WebGL loads; labels and the lock
     badge are DOM so they stay crisp and selectable. */
  .car3d{position:relative;width:100%;aspect-ratio:5/4;margin:var(--s2) 0 var(--s2);opacity:0;
    border-radius:var(--r4);overflow:hidden;transition:opacity var(--t-slow) linear}
  .car3d.ready{opacity:1}
  .car3d .c3d{display:block;width:100%;height:100%;cursor:grab}
  .car3d .c3d:active{cursor:grabbing}
  .c3l{position:absolute;left:0;top:0;pointer-events:none;display:flex;flex-direction:column;
    align-items:center;gap:1px;font-size:10px;line-height:1.1;color:var(--fnt);will-change:transform;
    transition:opacity var(--t-mid) linear}
  .c3l b{font-weight:650;letter-spacing:.12em;font-size:9px}
  .c3l span{font-weight:700;font-variant-numeric:tabular-nums}
  .c3l.ok span{color:var(--acc-ink)} .c3l.warn span{color:var(--warn)} .c3l.bad span{color:var(--bad)}
  .c3lock{position:absolute;top:var(--s3);right:var(--s3);display:inline-flex;align-items:center;gap:6px;
    padding:6px 11px;border-radius:var(--rf);background:var(--card);box-shadow:var(--sh-1);
    font-size:11.5px;font-weight:650;color:var(--acc-ink)}
  .c3lock.un{color:var(--warn)}
  .c3lock svg{width:13px;height:13px}
  .car3d-hint{text-align:center;font-size:11px;color:var(--fnt);margin:-2px 0 var(--s3)}
  .ckc{display:inline-flex;align-items:center;gap:6px}
  .ckc svg{width:13px;height:13px;flex:none}

  .bigbtn{display:block;width:100%;margin-top:var(--s4);background:var(--btn);color:var(--btn-ink);
    border-radius:var(--r2);padding:16px;font-size:14.5px;font-weight:700;
    transition:transform var(--t-fast) var(--eo),opacity var(--t-mid) linear}
  .bigbtn:active{transform:scale(.985)}
  .bigbtn:disabled{opacity:.35}

  /* A/C page */
  .acbig{display:flex;align-items:center;justify-content:center;gap:var(--s6);margin:var(--s6) 0 var(--s2)}
  .acbig .cur{font-size:72px;font-weight:750;letter-spacing:-.04em;line-height:.9;
    font-variant-numeric:tabular-nums}
  .acbig .cur u{font-size:20px;font-weight:650;color:var(--mut);text-decoration:none}
  .acbig .side{font-size:22px;font-weight:600;color:var(--line);font-variant-numeric:tabular-nums}
  .acsub{text-align:center;font-size:12.5px;color:var(--mut);margin-bottom:var(--s2)}
  .acrow{display:flex;justify-content:center;gap:var(--s5);margin-bottom:var(--s6)}
  .acrow .step{width:40px;height:40px;font-size:21px;box-shadow:var(--sh-1);background:var(--card)}
  .acacts{display:flex;justify-content:center;gap:var(--s6)}
  .acacts button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;
    font-weight:650;color:var(--mut);transition:color var(--t-mid) linear}
  .acacts .cic{width:54px;height:54px;border-radius:50%;background:var(--card);
    display:flex;align-items:center;justify-content:center;color:var(--ink);box-shadow:var(--sh-1);
    transition:transform var(--t-fast) var(--eo),color var(--t-mid) linear,box-shadow var(--t-mid) linear}
  .acacts button:active .cic{transform:scale(.9)}
  .acacts button.on{color:var(--acc-ink)}
  .acacts button.on .cic{color:var(--acc-ink);box-shadow:0 2px 6px var(--acc-sf),0 10px 24px var(--acc-sf)}
  .acacts .cic svg{width:23px;height:23px}
  .acseats{margin-top:var(--s5)}
  /* head-unit seat panel: the HU's own cabin render + seat glows (web/hu/, see tools/hu_assets.py) */
  .hucab{position:relative;width:min(100%,340px);aspect-ratio:874/968;margin:var(--s5) auto 0}
  .hucab>img{position:absolute;inset:0;width:100%;height:100%}
  .hucab .glow{position:absolute;width:30.21%;height:30.79%;pointer-events:none;
    transition:opacity var(--t-mid) linear}
  .hucab .sb{position:absolute;width:10.07%;aspect-ratio:1;border-radius:50%;padding:0;
    transform:translate(0,0);transition:transform .12s ease}
  .hucab .sb:active{transform:scale(.9)}
  .hucab .sb img{width:100%;height:100%;display:block}
  .hucab .sb.busy{opacity:.55}
  /* head-unit airflow view: the HU's EV climate screen (elac_main), half size, cropped to the dash */
  .huflow{position:relative;width:100%;aspect-ratio:520/330;margin:var(--s4) 0 var(--s2);
    border-radius:var(--r3);overflow:hidden;background:#0a0e14}
  .huflow>*{position:absolute;display:block}
  .huflow .fl{background-repeat:no-repeat;background-size:100% 2000%;opacity:0;
    transition:opacity var(--t-mid) linear;animation:huflow 2s steps(20) infinite}
  .huflow .fl.on{opacity:1}
  .huflow .mir{transform:scaleX(-1)}
  .huflow .dfz{left:10%;top:5%;width:80%;height:30%;border-radius:40% 40% 8px 8px;padding:0;background:none}
  .huflow .cap{left:0;right:0;bottom:8px;text-align:center;font-size:11.5px;color:#9aa4b2}
  @keyframes huflow{to{background-position:0 105.2632%}}
  .hucab .cap{position:absolute;bottom:-4px;left:0;right:0;text-align:center;font-size:11.5px;color:var(--mut)}
  .acseats .rl small{display:block;font-size:11.5px;font-weight:500;color:var(--mut)}
  .acseats .seg button{min-width:40px;min-height:36px}

  /* energy bars ----------------------------------------------------------------
     A faint full-height track keeps a no-driving day visible as an empty slot instead of a
     hole, so the week always reads as seven days. */
  .etrack{fill:var(--card-2)}
  .ebar{fill:var(--acc)}
  .ebar.hu{fill:var(--acc);fill-opacity:.22}
  .elegend .sw.swn{background:var(--acc);opacity:.3}
  .plbl .plsub{display:block;font-size:11.5px;font-weight:500;color:var(--mut);letter-spacing:0;
    text-transform:none;margin-top:2px}
  .calnet{font-size:12.5px;color:var(--mut);text-align:center;margin:-2px 0 var(--s3)}
  .eval{font-size:10px;font-weight:700;fill:var(--mut);font-variant-numeric:tabular-nums}
  .eday{font-size:9px;fill:var(--fnt);font-variant-numeric:tabular-nums}
  .eday.off{opacity:.45}
  .ebase{stroke:var(--line);stroke-width:1}
  .ewltp{stroke:var(--fnt);stroke-width:1.2;stroke-dasharray:3 4;opacity:.75}
  .ewlbl{font-size:9px;font-weight:650;fill:var(--fnt);letter-spacing:.04em}
  .elegend{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:var(--s4);
    padding-top:var(--s3);border-top:1px solid var(--line);font-size:11px;color:var(--fnt)}
  .elegend span{display:inline-flex;align-items:center;gap:6px}
  .elegend .sw{width:9px;height:9px;border-radius:3px;background:var(--acc);flex:none}
  .elegend .sw.d{width:12px;height:0;border-radius:0;background:none;
    border-top:1.5px dashed var(--fnt)}
  .elegend .gap{margin-left:auto;font-weight:600;color:var(--mut)}

  /* charts */
  #echart,#cchart{display:block;width:100%;margin-top:var(--s3);overflow:visible}
  .cstats{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2);margin-top:var(--s4);
    padding-top:var(--s3);border-top:1px solid var(--line);text-align:center}
  .cstats b{display:block;font-size:16.5px;font-weight:750;letter-spacing:-.015em;
    font-variant-numeric:tabular-nums}
  .cstats span{display:block;font-size:10px;color:var(--fnt);margin-top:3px}
  .crange{text-align:center;font-size:12px;color:var(--fnt);margin-top:var(--s3);line-height:1.5;
    font-variant-numeric:tabular-nums}
  .socbar{height:8px;border-radius:var(--rf);background:oklch(0.5 0 0 / .14);overflow:hidden;margin-top:var(--s4)}
  .socbar i{display:block;height:100%;border-radius:var(--rf);background:var(--acc);
    transition:width .9s var(--eo)}
  .hrow2{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3);
    padding:12px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--fnt);
    font-variant-numeric:tabular-nums}
  .hrow2:first-child{border-top:0}
  .hrow2 b{color:var(--ink);font-weight:700}

  /* calendar */
  .calhead{display:flex;align-items:center;justify-content:space-between;margin:var(--s2) 0 var(--s4)}
  .calhead b{font-size:16px;font-weight:750}
  .calnav{width:32px;height:32px;border-radius:50%;background:var(--card);color:var(--ink);
    display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-1);
    transition:transform var(--t-fast) var(--eo)}
  .calnav:active{transform:scale(.88)}
  .calnav svg{width:8px;height:13px}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .caldow{text-align:center;font-size:10px;font-weight:650;color:var(--fnt);padding-bottom:var(--s1)}
  .calday{background:var(--card);border-radius:var(--r1);padding:6px 2px;text-align:center;
    min-height:50px;position:relative;overflow:hidden;font:inherit;color:var(--ink);
    box-shadow:var(--sh-1);transition:transform var(--t-fast) var(--eo)}
  .calday.on:active{transform:scale(.92)}
  .calday.off{opacity:.4;pointer-events:none;box-shadow:none;background:transparent}
  .calday .cd{position:relative;z-index:1;font-size:10px;font-weight:600;color:var(--fnt);display:block;
    font-variant-numeric:tabular-nums}
  .calday .ck{position:relative;z-index:1;font-size:12px;font-weight:750;display:block;margin-top:3px;
    letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .calday .cdot{position:absolute;z-index:1;top:5px;right:5px;width:4px;height:4px;border-radius:50%;
    background:var(--acc)}
  .calwash{position:absolute;inset:0;background:var(--acc);pointer-events:none}
  .caltot{display:flex;gap:var(--s5);justify-content:center;margin-top:var(--s5);padding-top:var(--s4);
    border-top:1px solid var(--line);text-align:center}
  .caltot b{display:block;font-size:16.5px;font-weight:750;font-variant-numeric:tabular-nums}
  .caltot span{display:block;font-size:10.5px;color:var(--fnt);margin-top:3px}
  .caltot.mid{margin-top:var(--s4);padding-top:0;border-top:0}
  .calsub{text-align:center;font-size:12px;color:var(--fnt);margin-top:var(--s4)}
  .calday.off.cg{opacity:.75;pointer-events:auto;background:var(--card);box-shadow:var(--sh-1)}
  .calday.sel{box-shadow:inset 0 0 0 1.5px var(--acc)}
  .calcard{margin:var(--s5) 0 0}
  .calch{padding:var(--s4) var(--s4) 0;font-size:13.5px;font-weight:700}
  .calcard .caltot{margin:0;border-top:0;padding:var(--s3) var(--s4) var(--s4)}
  .calcard .row{min-height:54px;padding:11px var(--s4)}
  .calcard .caltot + .row{border-top:1px solid var(--line)}

  /* account header + share card */
  .vveh{background:linear-gradient(140deg,var(--heroA),var(--card));border-radius:var(--r3);
    padding:var(--s5) var(--s4);margin:var(--s2) 0 0;position:relative;overflow:hidden;
    box-shadow:var(--sh-1)}
  .vveh .vm{font-size:18px;font-weight:750}
  .vveh .vv{font-size:12px;color:var(--mut);margin-top:5px;font-variant-numeric:tabular-nums;
    user-select:text;-webkit-user-select:text}
  .vveh .vo{font-size:26px;font-weight:750;margin-top:var(--s3);letter-spacing:-.02em;
    font-variant-numeric:tabular-nums}
  .vveh .vo u{font-size:13px;font-weight:650;color:var(--mut);text-decoration:none;margin-left:3px}
  .vveh .ve{position:absolute;top:var(--s4);right:var(--s4);width:30px;height:30px;border-radius:50%;
    background:oklch(1 0 0 / .45);display:flex;align-items:center;justify-content:center;color:var(--mut)}
  .vveh .ve svg{width:16px;height:16px}
  .vveh img{position:absolute;right:-10px;bottom:-8px;width:168px;
    filter:drop-shadow(0 8px 10px oklch(0.30 0.03 250 / .22))}

  .flexc{background:linear-gradient(155deg,var(--heroA),var(--card));border-radius:var(--r4);
    padding:var(--s5);box-shadow:var(--sh-2)}
  .flexc .fm{font-size:12px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
  .flexc .fbig{font-size:52px;font-weight:750;letter-spacing:-.03em;line-height:1;margin-top:var(--s3);
    font-variant-numeric:tabular-nums}
  .flexc .fbig u{display:block;font-size:13px;font-weight:650;color:var(--mut);text-decoration:none;
    margin-top:8px}
  .fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4);margin-top:var(--s5);
    padding-top:var(--s4);border-top:1px solid var(--line)}
  .fgrid2 b{display:block;font-size:18px;font-weight:750;font-variant-numeric:tabular-nums}
  .fgrid2 span{display:block;font-size:11px;color:var(--fnt);margin-top:3px}
  .fgrid2 b small{font-size:11px;font-weight:600;color:var(--mut)}
  .flexc .fsub{font-size:11.5px;color:var(--fnt);margin-top:3px}
  .flexc .fbig u{letter-spacing:0}
  .flexc .fbeat{margin-top:var(--s4);padding:10px;border-radius:var(--r2);text-align:center;
    font-size:12.5px;font-weight:700;color:var(--acc-ink);background:var(--acc-sf)}
  .flexc .ffoot{margin-top:var(--s4);font-size:11px;line-height:1.5;color:var(--fnt);text-align:center}

  /* charge calculator */
  .cpto{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s3)}
  .cpto .pval u{font-size:22px;font-weight:650;color:var(--mut);text-decoration:none;margin-left:2px}
  .cpfrom{font-size:13px;color:var(--mut);padding-bottom:4px}
  .cpfrom b{color:var(--ink);font-weight:700}
  .cprange{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:var(--rf);
    margin:var(--s5) 0 var(--s2);background:var(--card-2);outline:none}
  .cprange::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;
    background:var(--card);border:2px solid var(--acc);box-shadow:var(--sh-1);cursor:pointer}
  .cprange::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--card);
    border:2px solid var(--acc);box-shadow:var(--sh-1);cursor:pointer}
  .cpchips{display:flex;gap:var(--s2);margin-top:var(--s3)}
  .cpchips button{flex:1;padding:8px 0;border-radius:var(--r1);background:var(--card-2);
    font-size:12.5px;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums}
  .cpchips button.on{background:var(--btn);color:var(--btn-ink)}
  .cpchips button:disabled{opacity:.35}
  .cpmode{display:flex;justify-content:space-between;align-items:center;gap:var(--s3)}
  .cpcost{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);margin-top:var(--s4);
    padding-top:var(--s3);border-top:1px solid var(--line)}
  .cpcost label{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut)}
  .cpcost input{width:84px;border-radius:var(--r1);padding:7px 9px;background:var(--card-2);color:var(--ink);
    font:inherit;font-size:14px;font-weight:650;text-align:right;border:0;font-variant-numeric:tabular-nums}
  .cpcost input::-webkit-outer-spin-button,.cpcost input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .cpcost .pval{font-size:26px;margin:0}

  .seg{display:inline-flex;border-radius:var(--r1);overflow:hidden;flex:none;background:var(--card-2)}
  .seg button{padding:7px 12px;font-size:12px;font-weight:700;color:var(--mut);
    transition:background var(--t-mid) linear,color var(--t-mid) linear}
  .seg button.on{background:var(--btn);color:var(--btn-ink)}

  /* confirm sheet */
  .scrim{position:fixed;inset:0;z-index:88;background:var(--scrim);opacity:0;pointer-events:none;
    transition:opacity var(--t-mid) linear}
  .scrim.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:90;max-width:430px;margin:0 auto;
    background:var(--card);border-radius:var(--r4) var(--r4) 0 0;
    padding:var(--s5) var(--pad) calc(var(--s5) + env(safe-area-inset-bottom));
    transform:translate3d(0,110%,0);transition:transform var(--t-slow) var(--eo);box-shadow:var(--sh-2)}
  .sheet.show{transform:none}
  .sheet .sq{font-size:17px;font-weight:750;text-align:center}
  .sheet .ss{font-size:12.5px;color:var(--fnt);text-align:center;margin-top:var(--s2);line-height:1.5}
  .sheet .sb{display:flex;gap:var(--s3);margin-top:var(--s5)}
  .sheet .sb button{flex:1;padding:15px;border-radius:var(--r2);font-size:14.5px;font-weight:700;
    transition:transform var(--t-fast) var(--eo)}
  .sheet .sb button:active{transform:scale(.985)}
  .sheet .no{background:var(--card-2);color:var(--ink)}
  .sheet .yes{background:var(--btn);color:var(--btn-ink)}

  .toast{position:fixed;left:var(--pad);right:var(--pad);bottom:calc(88px + env(safe-area-inset-bottom));
    max-width:390px;margin:0 auto;background:var(--btn);color:var(--btn-ink);
    font-size:13px;font-weight:600;line-height:1.4;padding:13px 16px;border-radius:var(--r2);
    text-align:center;opacity:0;transform:translate3d(0,10px,0);pointer-events:none;
    transition:opacity var(--t-mid) linear,transform var(--t-slow) var(--eo);z-index:80}
  .toast.show{opacity:1;transform:none}

  /* ---------- motion ----------
     State-bearing only, transform and opacity. The reduced-motion block flattens the CSS and
     the JS helpers check the same query before running. */
  .fadein{animation:fadein var(--t-slow) var(--eo)}
  @keyframes fadein{from{opacity:0;transform:translate3d(0,6px,0)}}
  .rise{animation:rise 420ms var(--eo) both}
  @keyframes rise{from{opacity:0;transform:translate3d(0,10px,0)}}
  .hname .hs .dot.on:after{content:"";position:absolute;inset:0;border-radius:50%;
    border:1px solid var(--acc);animation:ping 2.8s var(--eo) infinite}
  @keyframes ping{0%{transform:scale(1);opacity:.7}70%,100%{transform:scale(3.2);opacity:0}}
  @keyframes breathe{50%{opacity:.42}}
  .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);
    animation:draw 760ms var(--eo) 60ms forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .drawf{opacity:0;animation:drawf 520ms linear 420ms forwards}
  @keyframes drawf{to{opacity:1}}

  /* ---------- first-load skeleton ----------
     Same shapes as what replaces it (hero lines, round quick actions, the 2-up cards, the row
     list), so nothing jumps when the summary lands. One slow sheen, transform only; reduced
     motion keeps the blocks static. Every render replaces these nodes, so they never linger. */
  .sk{display:block;position:relative;overflow:hidden;border-radius:var(--r1);
    background:color-mix(in oklch,var(--ink) 9%,transparent)}
  .sk:after{content:"";position:absolute;inset:0;transform:translateX(-100%);
    background:linear-gradient(90deg,transparent,color-mix(in oklch,var(--card) 55%,transparent),transparent);
    animation:sheen 1.4s ease-in-out infinite}
  @keyframes sheen{to{transform:translateX(100%)}}
  @media (prefers-reduced-motion:reduce){ .sk:after{display:none} }
  .sk-model{width:132px;height:15px;margin-top:2px}
  .sk-state{width:150px;height:10px;margin-top:8px}
  .sk-range{width:150px;height:62px;margin:6px auto 0;border-radius:var(--r2)}
  .sk-bar{width:120px;height:9px;margin:0 auto;border-radius:var(--rf)}
  .qa .sk-qa{display:flex;flex-direction:column;align-items:center;gap:7px}
  .qa .sk-qa .sk:first-child{width:54px;height:54px;border-radius:50%}
  .qa .sk-qa .sk:last-child{width:40px;height:9px}
  .card.skc{min-height:94px}

THESIS: A well-made gauge, not an app screen. The range numeral is the whole first viewport; everything
else is a hairline list beneath it. Refuses both the stat-tile dashboard and the card-grid car app.
OWN-WORLD: instrument register — graphite in dark, cool paper in light, adaptive by system with a manual
override. Structure comes from hairlines and whitespace; there are no cards except where a chart needs
containment. One accent (product green) carries state only. No gradients, no glass, no shadows as decoration.

reading, walks one level down into doors, tyres, climate or energy.

<script>
const $ = id => document.getElementById(id);
let S = null, CAPS = null;
async function api(p, opt){ const r = await fetch(p, opt); if(r.status === 401){ location.href = './'; throw 0; } return r.json(); }
let toastT = null;
function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800); }

/* ---- theme: auto by default, manual override persisted per device ---- */
const THEME_DARK = '#101214', THEME_LIGHT = '#f7f7f8';
function readTheme(){ try{ return localStorage.getItem('theme') || 'auto'; }catch(e){ return 'auto'; } }
function applyTheme(t){
  const root = document.documentElement;
  if(t === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', t);
  const dark = t === 'dark' ||
    (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  $('themeColor').setAttribute('content', dark ? THEME_DARK : THEME_LIGHT);
}
function setTheme(t){ try{ localStorage.setItem('theme', t); }catch(e){} applyTheme(t); }
applyTheme(readTheme());
if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)')
  .addEventListener('change', () => { if(readTheme() === 'auto') applyTheme('auto'); });

/* ---- confirm sheet: replaces window.confirm, which blocks the PWA ---- */
let shResolve = null;
function ask(q, s){
  $('shQ').textContent = q; $('shS').textContent = s || '';
  $('shS').hidden = !s;
  $('scrim').classList.add('show'); $('sheet').classList.add('show');
  return new Promise(res => { shResolve = res; });
}
function askClose(v){
  $('scrim').classList.remove('show'); $('sheet').classList.remove('show');
  if(shResolve){ shResolve(v); shResolve = null; }
}
$('shNo').onclick = () => askClose(false);
$('scrim').onclick = () => askClose(false);
$('shYes').onclick = () => askClose(true);

// stroke icon glyphs — 24px round-stroke set, 1.8 weight, no fills except accents
const IC = {
  lock:    '<rect x="5" y="10.5" width="14" height="9.5" rx="2.6"/><path d="M8 10.5V7a4 4 0 018 0v3.5"/><circle cx="12" cy="15" r="1.4"/>',
  unlock:  '<rect x="5" y="10.5" width="14" height="9.5" rx="2.6"/><path d="M8 10.5V7a4 4 0 017.6-2"/><circle cx="12" cy="15" r="1.4"/>',
  find:    '<circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/><path d="M7.9 7.9a5.8 5.8 0 000 8.2M16.1 16.1a5.8 5.8 0 000-8.2M5 5a9.5 9.5 0 000 14M19 19a9.5 9.5 0 000-14"/>',
  ac:      '<circle cx="12" cy="12" r="2"/><path d="M12 10c0-3.2.4-6 2-6s3 2.2 1.8 4.2S12 10 12 10M14 12c3.2 0 6 .4 6 2s-2.2 3-4.2 1.8S14 12 14 12M12 14c0 3.2-.4 6-2 6s-3-2.2-1.8-4.2S12 14 12 14M10 12c-3.2 0-6-.4-6-2s2.2-3 4.2-1.8S10 12 10 12"/>',
  cool:    '<path d="M12 2.5v19M4.2 7l15.6 10M19.8 7L4.2 17"/><path d="M9.2 4l2.8 2.6L14.8 4M9.2 20l2.8-2.6L14.8 20M3.4 9.6L6.2 12l-2.8 2.4M20.6 9.6L17.8 12l2.8 2.4"/>',
  heat:    '<circle cx="12" cy="12" r="3.6"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5 5l2.1 2.1M16.9 16.9L19 19M19 5l-2.1 2.1M7.1 16.9L5 19"/>',
  power:   '<path d="M12 3v9"/><path d="M6.6 6.6a8 8 0 1010.8 0"/>',
  bolt:    '<path d="M13 2L4 14h6l-1 8 9-12h-6z" fill="currentColor" stroke="none"/>',
  door:    '<path d="M3 19.5h18"/><path d="M5 19.5v-6.8l2.8-5.2h6.4l2.3 5.2v6.8"/><path d="M7.8 12.7h6.9"/><circle cx="9" cy="15.8" r="0.9" fill="currentColor" stroke="none"/>',
  tyre:    '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.2"/><path d="M12 3.5v5.3M12 15.2v5.3M3.5 12h5.3M15.2 12h5.3"/>',
  chart:   '<path d="M4 19.5h16"/><path d="M4 15l4-5 4 3 5-7"/><circle cx="17" cy="6" r="1.2" fill="currentColor" stroke="none"/>',
  seat:    '<path d="M7 3.2a2 2 0 014 0V10h4.5a2 2 0 012 2v5.5"/><path d="M7 10v3a3 3 0 003 3h8.5"/><path d="M5 21l1.2-4M18.5 21v-3.5"/>',
  car:     '<path d="M4 16l1.8-5.3A3 3 0 018.6 8.7h6.8a3 3 0 012.8 2L20 16"/><rect x="3" y="16" width="18" height="4" rx="1.6"/><circle cx="7.5" cy="18" r="1.4" fill="currentColor" stroke="none"/><circle cx="16.5" cy="18" r="1.4" fill="currentColor" stroke="none"/>',
  globe:   '<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/>',
  gauge:   '<path d="M4 18a8 8 0 0116 0"/><path d="M12 18l4.5-6.5"/><circle cx="12" cy="18" r="1.5" fill="currentColor" stroke="none"/><path d="M4 18h1.5M18.5 18H20"/>',
  camera:  '<path d="M3 9.5A2.5 2.5 0 015.5 7h1.2l1.1-2h6.4l1.1 2h1.2A2.5 2.5 0 0120 9.5v8A2.5 2.5 0 0117.5 20h-11A2.5 2.5 0 014 17.5z"/><circle cx="12" cy="13" r="3.4"/>',
  link:    '<path d="M9 15l6-6"/><path d="M11.5 6.5l1.4-1.4a4 4 0 015.6 5.6L17 12"/><path d="M12.5 17.5l-1.4 1.4a4 4 0 01-5.6-5.6L7 12"/>',
  batt:    '<rect x="2.5" y="7" width="16" height="10" rx="2.6"/><path d="M21 10.5v3"/><rect x="4.8" y="9.3" width="11.4" height="5.4" rx="1.2" fill="currentColor" stroke="none"/>',
  fuel:    '<path d="M4 20V6a2 2 0 012-2h5a2 2 0 012 2v14"/><path d="M3 20h11"/><path d="M13 11h3a2 2 0 012 2v3.4a1.6 1.6 0 003.2 0V9.2L17.6 5.6"/><rect x="6.2" y="6.4" width="4.6" height="3.4" rx="1" fill="currentColor" stroke="none"/>',
  plug:    '<path d="M9 3v5M15 3v5"/><path d="M6.5 8h11v3.2a5.5 5.5 0 01-5.5 5.5 5.5 5.5 0 01-5.5-5.5Z"/><path d="M12 16.7V21"/>',
  moon:    '<path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/>',
  trunk:   '<path d="M3 18.5v-5.2a2 2 0 01.7-1.5L7 9h9.5a2 2 0 011.8 1.1L21 14.5v4"/><path d="M3 18.5h18"/><path d="M7 9l-1.8-4.2h-2"/><circle cx="7.5" cy="18.5" r="1.6" fill="currentColor" stroke="none"/><circle cx="16.5" cy="18.5" r="1.6" fill="currentColor" stroke="none"/>',
  window:  '<path d="M5 20V9.5C5 6.5 8 4.5 12 4.5s7 2 7 5V20"/><path d="M5 11.5h14"/><path d="M12 11.5V17M9.5 14.5L12 17l2.5-2.5"/>',
};
function icon(k, w){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (w || 1.8) +
  '" stroke-linecap="round" stroke-linejoin="round">' + (IC[k] || '') + '</svg>'; }
const CHEV = '<svg class="ch" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg>';

const CK_OK  = '<span class="ckc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6"/></svg>';
const CK_BAD = '<span class="ckc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5.5v8.5"/><circle cx="12" cy="18.4" r="1.3" fill="currentColor" stroke="none"/></svg>';

/* ---- motion helpers ----
   The design contract allows motion that carries state and nothing else, so each of
   these is tied to a real event: a value arriving, a value changing, a page painting. */
const REDUCED = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

// needle-style count toward a new reading. Tabular figures keep the width steady.
function countTo(el, to, dur){
  const from = parseFloat(String(el.textContent).replace(/[^\d.-]/g, ''));
  if(to == null || isNaN(to)){ el.textContent = '—'; return; }
  if(isNaN(from) || from === to || REDUCED()){ el.textContent = to; return; }
  const t0 = performance.now(), d = dur || 620, span = to - from;
  cancelAnimationFrame(el._raf);
  const tick = now => {
    const p = Math.min(1, (now - t0) / d);
    const e = 1 - Math.pow(1 - p, 3);                 // ease-out cubic
    el.textContent = Math.round(from + span * e);
    if(p < 1) el._raf = requestAnimationFrame(tick);
  };
  el._raf = requestAnimationFrame(tick);
}

// warm a value for a moment when the poll actually changed it. The rows are rebuilt
// from innerHTML on every load, so the previous reading is kept here, not on the node.
const PREV = {};
function flash(el, key, next){
  const v = String(next);
  const changed = PREV[key] !== undefined && PREV[key] !== v;
  PREV[key] = v;
  if(!changed || REDUCED()) return;
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 700);
}

// first-paint rise, one small stagger, never on a re-poll
function stagger(nodes, step, base){
  if(REDUCED()) return;
  nodes.filter(Boolean).forEach((n, i) => {
    n.style.animationDelay = ((base || 0) + i * (step || 34)) + 'ms';
    n.classList.add('rise');
  });
}

// let a chart stroke draw itself, then fade in its labels and dots
function drawIn(svg){
  if(!svg || REDUCED()) return;
  svg.querySelectorAll('polyline,path').forEach(p => {
    if(p.getAttribute('fill') !== 'none' && p.getAttribute('fill')){ p.classList.add('drawf'); return; }
    let len = 0;
    try{ len = p.getTotalLength(); }catch(e){ return; }
    if(!len) return;
    p.style.setProperty('--len', len.toFixed(1));
    p.classList.add('draw');
  });
  svg.querySelectorAll('circle,text,line').forEach(n => n.classList.add('drawf'));
}

function ago(dt){ if(!dt) return ''; const s = (Date.now() - new Date(dt.replace(' ', 'T'))) / 1000;
  if(s < 90) return 'just now'; if(s < 3600) return Math.round(s / 60) + ' min ago';
  if(s < 86400) return Math.round(s / 3600) + ' h ago'; return Math.round(s / 86400) + ' d ago'; }

// ---- remote control: same pipe as v1 (init 77, then fire) ----
// What the toast says per opcode: [result when the car accepted it, the thing we tried to do].
// Opcodes themselves stay out of the UI; unknown ones fall back to a generic line.
const OP_TEXT = {
  '740100': ['Car locked', 'lock the car'],
  '740200': ['Car unlocked', 'unlock the car'],
  '741001': ['A/C is on', 'turn the A/C on'],
  '741000': ['A/C is off', 'turn the A/C off'],
  '741F01': ['Heat is on', 'turn the heat on'],
  '741F00': ['Heat is off', 'turn the heat off'],
  '742001': ['Cooling is on', 'turn cooling on'],
  '742000': ['Cooling is off', 'turn cooling off'],
  '740400': ['Car is signalling', 'find the car'],
  '740300': ['Trunk opening', 'open the trunk'],
  '740A00': ['Trunk closing', 'close the trunk'],
  '740500': ['Windows closing', 'close the windows'],
  '740E00': ['Windows venting', 'vent the windows'],
  '740600': ['Windows opening', 'open the windows'],
  '740F00': ['Sunroof closing', 'close the sunroof'],
  '740F02': ['Sunroof tilting', 'tilt the sunroof'],
  '740F01': ['Sunroof opening', 'open the sunroof'],
  '742701': ['Charging stopped', 'stop charging'],
  '742401': ['Steering wheel heat on', 'heat the steering wheel'],
  '742400': ['Steering wheel heat off', 'turn steering wheel heat off'],
  '742301': ['Windshield heat on', 'heat the windshield'],
  '742300': ['Windshield heat off', 'turn windshield heat off'],
  '742501': ['Air purifier on', 'turn the air purifier on'],
  '742500': ['Air purifier off', 'turn the air purifier off'],
  '741201': ['Defog on', 'turn defog on'],
  '741200': ['Defog off', 'turn defog off'],
};
// Seat heat / vent opcodes: 74 <seat cmd> <level 00-03> (#11 jump table, docs/control-opcodes.md).
const SEAT_CMD = {heat: {L: '15', R: '16', RL: '17', RR: '19'},
                  vent: {L: '1A', R: '1B', RL: '1C', RR: '1E'}};
const SEAT_NAME = {L: 'Left seat', R: 'Right seat', RL: 'Rear left seat', RR: 'Rear right seat'};
function seatOp(kind, seat, level){ return '74' + SEAT_CMD[kind][seat] + '0' + level; }
// A/C set-point: 7411 + one byte = 0x80 + 2 x degC, so half degrees fit (7411AC = 22.0 degC).
// Captured from the vendor app in PR #16; the old whole-degC byte read as -53 degC on the car.
function tempOp(c){ return '7411' + (0x80 + Math.round(c * 2)).toString(16).toUpperCase().padStart(2, '0'); }
function opText(op){
  const k = String(op).toUpperCase();
  if(OP_TEXT[k]) return OP_TEXT[k];
  const m = /^7411([0-9A-F]{2})$/.exec(k);       // A/C target temp: 0x80 + 2 x degC
  if(m){ const c = (parseInt(m[1], 16) - 0x80) / 2; return ['A/C set to ' + c + '°C', 'set the A/C to ' + c + '°C']; }
  const sm = /^74([0-9A-F]{2})0([0-3])$/.exec(k);
  if(sm){
    for(const kind in SEAT_CMD) for(const seat in SEAT_CMD[kind]) if(SEAT_CMD[kind][seat] === sm[1]){
      const what = SEAT_NAME[seat] + (kind === 'heat' ? ' heat' : ' vent');
      const lv = sm[2] === '0' ? 'off' : 'level ' + sm[2];
      return [what + ' ' + lv, 'set ' + what.toLowerCase() + ' to ' + lv];
    }
  }
  return ['Done', 'do that'];
}
// state a command leaves behind once the car has confirmed it (result byte 00)
const OPTIMISTIC = {
  '740100': {unlocked: false}, '740200': {unlocked: true},
  '741001': {ac_on: true},     '741000': {ac_on: false},
  '740300': {trunk_open: true}, '740A00': {trunk_open: false},
};
async function fire(op, btn){        // resolves true when the car accepted the command
  const [done, doing] = opText(op);
  let ok = false;
  if(btn) btn.classList.add('busy');
  try{
    await api('api/control', {method: 'POST', headers: {'content-type': 'application/json'},
      body: JSON.stringify({data: '77', timeOut: 20})});
    await new Promise(r => setTimeout(r, 600));
    const d = await api('api/control', {method: 'POST', headers: {'content-type': 'application/json'},
      body: JSON.stringify({data: op, timeOut: 20})});
    if(d.ok){
      ok = true; toast(done);
      // the car answered 00 (done), so show the new state now; the next pushed frame confirms it
      const patch = OPTIMISTIC[String(op).toUpperCase()];
      if(patch && S){ Object.assign(S, patch); renderAll(); }
      if(!liveOk()) setTimeout(load, 1800);
    }
    else if(d.reason) toast('Could not ' + doing + ': ' + d.reason);
    else if(String(d.code) === '50043') toast('Car is asleep or out of signal');
    else if(String(d.code) === '9997') toast('CarLinko login expired');
    else toast('Could not ' + doing);
  }catch(e){ toast('Could not reach the dashboard server'); }
  if(btn) btn.classList.remove('busy');
  return ok;
}

// ---- hero ----
function renderHero(){
  $('hModel').textContent = (S.vehicle && S.vehicle.model) || 'My car';
  countTo($('hRange'), S.range_km != null ? Math.round(S.range_km) : null);
  $('hDot').className = 'dot' + (S.online ? ' on' : '');
  $('hState').textContent =
    S.moving ? 'Driving' : (S.charging && S.charging.active) ? 'Charging' : 'Powered off';
  $('hWhen').textContent = '\u00b7  Updated ' + (ago(S.updated) || 'never');
  renderBars();
  // the cable is a charging state, so it lives with the rest of the hero state
  // The charging photo is a photograph of a Jaecoo J5, so it is only ever shown on a J5.
  // Other cars run this same dashboard (see the compat issues), and showing them a picture of
  // someone else's car plugged in would be stating something false about their vehicle. They
  // keep their own render, and the charging pill below still reports the live session.
  const charging = !!(S.charging && S.charging.active) || /[?&]cable=1/.test(location.search);
  $('carWrap').classList.toggle('charging', charging && isJ5());
  const img = $('hCar');
  img.onerror = () => { img.onerror = null; img.src = 'car-generic.svg'; };
  img.src = 'car-photo';
}

// State-of-charge bar under the range numeral. A second, blue fuel bar appears only when the
// car actually reports a tank -- the BYD screen this follows is a PHEV and shows two, but
// inventing one on a BEV would be stating a number the car never sent.
function renderBars(){
  const el = $('hBars');
  const bar = (cls, ic, pct) =>
    '<span class="bar ' + cls + '">' + icon(ic, 2) +
    '<span class="tr"><i style="width:' + Math.max(0, Math.min(100, pct)) + '%"></i></span>' +
    '<span class="pc num">' + Math.round(pct) + '%</span></span>';
  let h = '';
  if(S.battery != null) h += bar('ev', 'batt', S.battery);
  if(S.fuel != null)    h += bar('fu', 'fuel', S.fuel);
  el.innerHTML = h;
  const pc = el.querySelector('.bar.ev .pc');
  if(pc) flash(pc, 'soc', S.battery);
}

function renderQA(){
  const acOn = !!S.ac_on;
  const locked = !S.unlocked;
  const qa = $('qaRow'); qa.innerHTML = '';
  const defs = [
    {k: locked ? 'unlock' : 'lock', label: locked ? 'Unlock' : 'Lock',
     op: locked ? '740200' : '740100', ask: locked, active: !locked},
    {k: 'ac',   label: acOn ? 'A/C off' : 'A/C on', op: acOn ? '741000' : '741001', active: acOn},
    {k: 'find', label: 'Find', op: '740400'},
  ];
  // trunk sits on the home row because it is the one you reach for with full hands; it asks first
  // so a pocket-tap cannot pop the boot. 740300 / 740A00 runtime-confirmed on a J5 (docs/control-opcodes.md).
  if(!CAPS || CAPS.liftgate || CAPS.trunk)
    defs.push(S.trunk_open
      ? {k: 'trunk', label: 'Close trunk', op: '740A00', active: true}
      : {k: 'trunk', label: 'Trunk', op: '740300', ask: true, askNote: 'Opens the rear trunk now.'});
  if(S.charging && S.charging.active)
    defs.push({k: 'power', label: 'Stop', op: '742701', ask: true, askNote: 'Ends the charging session on the car.'});
  defs.forEach(d => {
    const b = document.createElement('button');
    b.className = d.active ? 'on' : '';
    b.setAttribute('aria-label', d.label);
    b.innerHTML = '<span class="qc">' + icon(d.k) + '</span>' + d.label;
    b.onclick = async () => {
      if(d.ask && !(await ask(d.label + '?', d.askNote || 'The command is sent to the car now.'))) return;
      fire(d.op, b);
    };
    qa.appendChild(b);
  });
}

// windows byte: 0 = all closed (E5-verified). On the J5 it reads 16 while parked for unknown
// reasons (model-specific, #5), so on a J5 we refuse to guess and report null.
// The charging photo below and the windows quirk are both J5-specific, so the model test
// lives in one place. Anything that is true of this car and not of the others in the compat
// issues (#1 Tiggo 8, #3 Tiggo 7 PHEV, #5 Omoda E5) has to be gated on this.
function isJ5(){
  const m = ((S && S.vehicle && S.vehicle.model) || '').toLowerCase();
  return m.indexOf('j5') >= 0 || m.indexOf('jaecoo') >= 0;
}

function windowsOpen(){
  if(S.windows == null) return null;
  if(isJ5()) return null;
  return S.windows !== 0;
}

// ac_temp_c (byte 24): a raw degC reading, validated against the Omoda E5's A/C target temp.
// The J5 has read wildly different things under this same byte over time -- 159-169 in earlier
// logs, and a near-static 47-51 now that barely moves with A/C on/off or the hour of day. Neither
// is a plausible cabin-air temperature, so on a J5 this byte is unverified and refused rather than
// shown as if it were a real reading (see #5 for the E5 validation this was carried over from).
function cabinTemp(){
  if(isJ5()) return null;
  return (S.ac_temp_c && S.ac_temp_c < 60) ? S.ac_temp_c : null;
}

// On the J5, byte 24 is the A/C SET-POINT in half degrees, not a cabin reading: 2 x degC with an
// optional 0x80 flag (Jun-Aug 2026 it read 170-181, since the early-Sep OTA 38-53 -- both are
// 19-26.5 degC, odd values are the .5 steps). Same encoding the 7411 set-point command uses.
function acSetPoint(){
  if(!isJ5() || !S.ac_temp_c) return null;
  const c = (S.ac_temp_c & 0x7F) / 2;
  return (c >= 15 && c <= 32) ? c : null;
}

function doorSummary(){
  const parts = [];
  const openDoors = S.doors == null ? null : (S.doors & 15) !== 0;
  const winOpen = windowsOpen();
  if(openDoors) parts.push('Door open');
  if(winOpen === true) parts.push('Windows open');
  if(S.trunk_open) parts.push('Trunk open');
  if(S.sunroof_open) parts.push('Sunroof open');
  if(!parts.length && openDoors === false && !S.unlocked) return {t: 'Closed, locked', cls: 'ok'};
  if(!parts.length) return {t: S.unlocked ? 'Unlocked' : 'Closed', cls: S.unlocked ? 'warn' : 'ok'};
  return {t: parts.join(' · '), cls: 'bad'};
}

function renderCharging(){
  const c = S.charging || {}, el = $('chgPill');
  if(!c.active){ el.hidden = true; return; }
  el.hidden = false;
  const bits = [];
  if(c.mode) bits.push(c.mode === 'dc' ? 'DC fast' : 'AC');
  if(c.rate_kw != null) bits.push(c.rate_kw + ' kW');
  if(c.remaining_min != null) bits.push(Math.floor(c.remaining_min / 60) ?
    (Math.floor(c.remaining_min / 60) + ' h ' + (c.remaining_min % 60) + ' min left') :
    (c.remaining_min + ' min left'));
  el.innerHTML = icon('plug', 2) + '<span>Charging</span><span class="dim">' +
    (bits.join(' · ') || '') + '</span>';
}

/* ---- home: BYD card grid on top, full-width rows underneath ----
   The grid carries the things you act on (climate, doors, tyres, battery). The rows carry the
   things you only read. Same split as the reference app, and it keeps the first screen to one

function card(ic, title, sub, cls, page){

}
function row(ic, label, val, cls, page){

  return '<' + tag + ' class="row"' + (page ? ' data-page="' + page + '"' : '') + '>' +
    '<span class="ri">' + icon(ic) + '</span>' +
    '<span class="rl">' + label + '</span>' +
    '<span class="rv ' + (cls || '') + '">' + val + '</span>' +
    (page ? CHEV : '') + '</' + tag + '>';
}

  const ds = doorSummary();

  const e = S.energy || {};

  const tyreSub = S.tyre_indirect === false

                     (S.seat_vent && (S.seat_vent[0] || S.seat_vent[1]));

    : (S.charging && S.charging.month_kwh ? S.charging.month_kwh + ' kWh this month' : 'No sessions yet');
  const battSub = (S.battery != null ? S.battery + '%' : '\u2014') +

  $('cardGrid').innerHTML =
    '<div class="card clim" data-page="ac">' +
      '<div class="cr"><button class="step" data-step="-1" aria-label="Cooler">&minus;</button>' +
        '<span class="temp num" id="climTemp">' + acTarget + '\u00b0</span>' +
        '<button class="step" data-step="1" aria-label="Warmer">+</button></div>' +
      '<div class="cr" style="margin-top:12px">' +
        '<span><span class="t">A/C</span><span class="s ' + (S.ac_on ? 'ok' : '') + '" id="climState">' +
          cabin + '</span></span>' +
        '<button class="cb' + (S.ac_on ? ' on' : '') + '" data-page="ac" aria-label="Climate detail">' +
          icon('ac') + '</button></div></div>' +
    '<div style="display:grid;gap:12px">' +
      card('door', 'Doors', ds.t, ds.cls, 'doors') +
      card('tyre', 'Tyres', tyreSub, S.tyre_status === 'Normal' ? 'ok' : 'warn', 'tyres') +
    '</div>' +
    card('bolt',  'Battery',  battSub, S.volt12_status === 'critical' ? 'bad' : '', 'batt') +
    card('plug', 'Charging', chgSub, (S.charging && S.charging.active) ? 'ok' : '', 'chg');

  $('rowsHost').innerHTML = '<div class="rowcard">' +
    row('chart', 'Energy consumption', cons, '', 'energy') +
    row('car',   'Distance',  distSub, '', 'dist') +
    row('seat',  'Seats', seatsKnown ? 'Active' : (seatCaps ? 'Off' : 'Not available'), '',
        seatCaps ? 'ac' : null) +
    '</div>';

  const hosts = [$('cardGrid'), $('rowsHost')];
  hosts.forEach(h => h.querySelectorAll('[data-page]').forEach(b =>
    b.onclick = ev => { ev.stopPropagation(); openPage(b.dataset.page); }));
  $('cardGrid').querySelectorAll('[data-step]').forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    const r = acRange();
    acTarget = Math.min(r.mx, Math.max(r.mn, acTarget + Number(b.dataset.step) * r.st));
    $('climTemp').textContent = acTarget + '\u00b0';

  // warm any value the poll actually changed; rise once on the first paint only
  let i = 0;
  hosts.forEach(h => h.querySelectorAll('.card .s, .row .rv').forEach(v => flash(v, 'v' + (i++), v.textContent)));
  if(!S._painted){
    stagger([].concat([...$('cardGrid').children], [...$('rowsHost').children]), 40, 120);
    S._painted = true;
  }
}

let acTarget = 24, acTimer = null;
function acRange(){                       // the car's own set-point range and step (J5: 15.5-30.5, 0.5)
  const c = (CAPS && CAPS.ac) || {};
  return {mn: c.min != null ? c.min : 16, mx: c.max != null ? c.max : 30, st: c.step || 0.5};
}
function sendTemp(){
  // debounced so stepping does not spam the car
  clearTimeout(acTimer);
  acTimer = setTimeout(() => fire(tempOp(acTarget)), 800);
}
// Seat rows this car offers, from its own vehicleControlConfig (CAPS.seats). Each row carries its
// kind, seat, highest level and the level the status blob reports now (front seats only).
function seatControls(){
  const sc = CAPS && CAPS.seats;
  if(!sc || !S) return [];
  const out = [];
  ['heat', 'vent'].forEach(kind => {
    const k = sc[kind] || {};
    const now = kind === 'heat' ? (S.seat_heat || []) : (S.seat_vent || []);
    if(k.left)  out.push({kind, seat: 'L', max: k.left,  now: now[0] || 0});
    if(k.right) out.push({kind, seat: 'R', max: k.right, now: now[1] || 0});
    if(k.rear){ out.push({kind, seat: 'RL', max: k.rear, now: null});
                out.push({kind, seat: 'RR', max: k.rear, now: null}); }
  });
  return out;
}

// Right-hand drive markets get the HU's mirrored cabin (wheel on the right). Guessed from the

function rhd(){

    return /^(Asia\/(Jakarta|Pontianak|Makassar|Jayapura|Kuala_Lumpur|Kuching|Singapore|Bangkok|Tokyo|Kolkata|Calcutta|Karachi|Dhaka|Colombo|Hong_Kong|Macau|Brunei|Kathmandu|Thimphu)|Australia\/|Pacific\/(Auckland|Fiji)|Europe\/(London|Dublin|Malta)|Africa\/(Johannesburg|Nairobi|Harare|Lusaka|Maputo|Gaborone|Windhoek|Kampala|Dar_es_Salaam|Maseru|Mbabane|Blantyre)|Indian\/Mauritius|America\/(Jamaica|Barbados|Port_of_Spain|Guyana|Nassau))/.test(z);
  }catch(e){ return false; }
}

// the dash (x 100-620, y 40-370). The car only reports A/C on/off and front defog, not where the vents

const SEAT_POS = {L: [148, 173], R: [460, 173], RL: [152, 517], RR: [460, 517]};   // HU layout, px of 874x968
const seatLocal = {};          // last level we sent, for seats the status blob does not report
function huSeatHtml(seats){
  const dark = isDark();
  const cab = 'hu/cabin' + (rhd() ? '-r' : '') + (dark ? '-dark' : '-light') + '.webp';
  const kinds = new Set(seats.map(r => r.kind));
  let h = '<div class="hucab"><img src="' + cab + '" alt="Cabin seen from above">';
  seats.forEach(r => {
    // what we just sent wins for a minute (the status blob lags a poll behind), then the car's word
    const mine = seatLocal[r.kind + r.seat];
    const lv = (mine && Date.now() - mine.t < 60000) || r.now == null ? (mine ? mine.lv : 0) : r.now;
    const [x, y] = SEAT_POS[r.seat];
    const front = r.seat === 'L' || r.seat === 'R';
    const both = kinds.size > 1;
    if(lv && front)
      h += '<img class="glow" src="hu/' + r.kind + '-glow' + lv + '.webp" alt="" style="left:' +
        (x / 8.74).toFixed(2) + '%;top:' + (y / 9.68).toFixed(2) + '%">';
    // one button per seat sits on the cushion like the HU; with heat AND vent the second one
    // goes just below it
    const by = y + 105 + (both && r.kind === 'heat' ? 100 : 0);
    const icon = 'hu/' + r.kind + Math.min(lv, 3) + (r.seat === 'R' || r.seat === 'RR' ? '-r' : '') + '.webp';
    const nxt = (lv + 1) % (r.max + 1);
    h += '<button class="sb" data-seat="' + r.kind + ':' + r.seat + ':' + nxt + '" style="left:' +
      ((x + 88) / 8.74).toFixed(2) + '%;top:' + (by / 9.68).toFixed(2) + '%" aria-label="' +
      SEAT_NAME[r.seat] + (r.kind === 'heat' ? ' heat' : ' ventilation') + ', level ' + lv + ' of ' + r.max +
      '. Tap for ' + (nxt ? 'level ' + nxt : 'off') + '"><img src="' + icon + '" alt=""></button>';
  });
  return h + '<div class="cap">Tap a seat to step its level</div></div>';
}

  $('acMinus').onclick = () => { acTarget = Math.max(mn, acTarget - st); renderAc(); sendTemp(); };

  el.querySelector('[data-ac="pwr"]').onclick  = () => fire(S.ac_on ? '741000' : '741001');

/* ---- 3D car ----
   car3d.js (low-poly clay SUV, three.js) is loaded on demand the first time a page needs it. If
   the module, WebGL or the dynamic import is unavailable, the flat diagram below simply stays. */
const CAR3D = {};
function isDark(){
  const t = document.documentElement.getAttribute('data-theme');
  return t ? t === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
}
function mount3d(key, wrapId, view, state, labels){
  if(CAR3D[key]){ CAR3D[key].dispose(); delete CAR3D[key]; }
  const wrap = $(wrapId);
  if(!wrap) return;
  import('./car3d.js').then(m => {
    if(!wrap.isConnected) return;                        // page was re-rendered meanwhile
    const host = document.createElement('div');
    host.className = 'car3d';
    wrap.parentNode.insertBefore(host, wrap);
    const hint = document.createElement('div');
    hint.className = 'car3d-hint'; hint.textContent = 'Drag to turn the car';
    try{
      CAR3D[key] = m.createCar3D(host, {view: view, dark: isDark(), labels: labels || null,
        lockIcon: icon('lock', 2),
        onFail: () => {                                   // car_parts.* did not load: back to the flat diagram
          if(CAR3D[key]){ CAR3D[key].dispose(); delete CAR3D[key]; }
          host.remove(); hint.remove(); wrap.hidden = false;
        }});
    }catch(e){ host.remove(); return; }
    wrap.hidden = true;
    CAR3D[key].set(state);
    host.after(hint);
  }).catch(() => {});
}

/* ---- shared top-view diagram ----
   A deliberately generic car: an outline, a greenhouse, four hinged door panels, a liftgate, a
   sunroof and four wheels. It is not a J5 and is not trying to be — it is the universal top-down
   body every car app draws, so it stays honest for whatever vehicle the backend is talking to.
   Both the Tyres and the Doors page render this same shape; each lights up only the parts it
   actually has data for. Every moving panel pivots about a real hinge, so opening is a rotation
   (a door) or a foreshortening toward the hinge (a hatch or sunroof lifting away from the viewer).

   opts:
     wheels     one class for all four, or an array of four in FL FR RL RR order
     wheelVals  per-wheel label text, same order
     codes      draw the FL/FR/RL/RR corner codes
     doors      array of four booleans, FL FR RL RR, true = open
     trunk      liftgate open
     sunroof    sunroof open
     unlocked   draws the body lock glyph open instead of shut                            */
const WHEEL_XY = [[19, 48], [110, 48], [19, 150], [110, 150]];   // FL, FR, RL, RR
const WHEEL_POS = ['FL', 'FR', 'RL', 'RR'];
// door panel: [path, hinge x, hinge y, side]. Hinge is always the forward edge, as on a real car.
const DOOR_GEO = [
  ['M40 74 L31 76 C29.5 88 29.5 106 31 116 L40 118 Z',  35.5,  75, 'l'],   // FL
  ['M100 74 L109 76 C110.5 88 110.5 106 109 116 L100 118 Z', 104.5, 75, 'r'], // FR
  ['M40 121 L31 121 C29.5 132 29.5 150 31 159 L40 161 Z', 35.5, 121, 'l'],  // RL
  ['M100 121 L109 121 C110.5 132 110.5 150 109 159 L100 161 Z', 104.5, 121, 'r'], // RR
];
function carTop(o){
  o = o || {};
  const cls = i => 'wh' + (o.wheels ? ' ' + (Array.isArray(o.wheels) ? (o.wheels[i] || '') : o.wheels) : '');
  let w = '';
  WHEEL_XY.forEach((p, i) => {
    const left = p[0] < 70;
    const tx = left ? p[0] - 4 : p[0] + 15;      // labels sit outside the wheel
    const anc = left ? 'end' : 'start';
    w += '<rect class="' + cls(i) + '" x="' + p[0] + '" y="' + p[1] + '" width="11" height="30" rx="4.5"/>';
    if(o.codes)
      w += '<text class="whc" x="' + tx + '" y="' + (p[1] + 12) + '" text-anchor="' + anc + '">' +
        WHEEL_POS[i] + '</text>';
    if(o.wheelVals && o.wheelVals[i])
      w += '<text class="whv ' + (Array.isArray(o.wheels) ? (o.wheels[i] || '') : (o.wheels || '')) +
        '" x="' + tx + '" y="' + (p[1] + 25) + '" text-anchor="' + anc + '">' + o.wheelVals[i] + '</text>';
  });

  const doors = o.doors || [];
  let dp = '';
  DOOR_GEO.forEach((g, i) => {
    dp += '<path class="cdoor ' + g[3] + (doors[i] ? ' open' : '') + '" data-door="' + i + '" d="' + g[0] +

/* Door bitmask from byte 2: 1 = driver, 2 = passenger, 4 = rear-driver, 8 = rear-passenger.
   Live per-door tested on an Omoda E5 (issue #5), NOT yet cross-checked on the J5, so the page
   says where the mapping came from. "Driver" is a side, not a fixed corner: this car is RHD
   (Jakarta plate), so the driver sits front-right. Panel order is FL, FR, RL, RR. */
const RHD = true;
function doorBits(mask){
  if(mask == null) return [false, false, false, false];
  const drv = 1, pas = 2, rdrv = 4, rpas = 8;
  return RHD
    ? [!!(mask & pas), !!(mask & drv), !!(mask & rpas), !!(mask & rdrv)]
    : [!!(mask & drv), !!(mask & pas), !!(mask & rdrv), !!(mask & rpas)];
}
const DOOR_NAME = ['Front left', 'Front right', 'Rear left', 'Rear right'];

/* Status rows and 3D state for the Doors page. Split out so a live refresh can update an open page
   in place: the 3D car keeps running and its panels swing to the new state instead of remounting. */
function doorStatus(){
  const winOpen = windowsOpen();
  const open = doorBits(S.doors);
  const doorsOpen = S.doors != null && (S.doors & 15) !== 0;
  const rows = [];
  function r(label, ok, okTxt, badTxt){
    rows.push('<div class="row"><span class="rl">' + label + '</span>' +
      '<span class="rv ' + (ok ? 'ok' : 'bad') + '">' + (ok ? CK_OK : CK_BAD) +
      (ok ? okTxt : badTxt) + '</span></span></div>');
  }
  r('Doors', !doorsOpen && !S.unlocked,
    S.unlocked ? 'Closed' : 'Closed and locked',
    doorsOpen ? open.map((v, i) => v ? DOOR_NAME[i] : null).filter(Boolean).join(', ') || 'Open'
              : 'Unlocked');
  if(winOpen !== null) r('Windows', !winOpen, 'Closed', 'Open');
  if(CAPS && CAPS.sunroof && (CAPS.sunroof.open || CAPS.sunroof.tilt))
    r('Sunroof', !S.sunroof_open, 'Closed', 'Open');
  r('Rear trunk', !S.trunk_open, 'Closed', 'Open');
  return {open: open, rows: rows.join(''),
          car: {doors: open, trunk: !!S.trunk_open, sunroof: !!S.sunroof_open, unlocked: !!S.unlocked}};
}
function paintDoorSvg(open){
  const svg = $('doorCar');
  if(!svg) return;
  svg.querySelectorAll('[data-door]').forEach(p =>
    p.classList.toggle('open', !!open[+p.dataset.door]));
  svg.querySelector('.clid').classList.toggle('open', !!S.trunk_open);
  svg.querySelector('.csun').classList.toggle('open', !!S.sunroof_open);
  svg.querySelectorAll('.chole')[0].classList.toggle('on', !!S.sunroof_open);
  svg.querySelectorAll('.chole')[1].classList.toggle('on', !!S.trunk_open);
}
// live refresh while the Doors page is open: rows, flat diagram and 3D car follow the new state
function liveDoors(){
  const st = doorStatus(), card = $('doorRows');
