<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1012" id="themeColor">
<title>My Vehicle</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  /* ================= INSTRUMENT =================
     Adaptive light/dark. Graphite and paper, hairlines instead of cards,
     one accent, editorial numerals. No gradients, no glass, no tiles. */
  :root{
    /* --- light: cool paper --- */
    --bg:      oklch(0.975 0.003 250);
    --bg-2:    oklch(1 0 0);
    --bg-3:    oklch(0.955 0.004 250);
    --ink:     oklch(0.22 0.012 255);
    --mut:     oklch(0.44 0.010 255);   /* ~5.6:1 on bg */
    --fnt:     oklch(0.48 0.008 255);   /* ~4.8:1 on bg */
    --line:    oklch(0.895 0.004 250);
    --hair:    oklch(0.93 0.003 250);
    --acc:     oklch(0.53 0.13 162);    /* graph / fill */
    --acc-ink: oklch(0.46 0.12 162);    /* accent as text */
    --acc-sf:  oklch(0.53 0.13 162 / .12);
    --warn:    oklch(0.58 0.13 68);
    --bad:     oklch(0.52 0.18 27);
    --btn:     oklch(0.22 0.012 255);
    --btn-ink: oklch(0.99 0 0);
    --shade:   oklch(0.22 0.012 255 / .04);
    --scrim:   oklch(0.22 0.012 255 / .34);

    /* --- scales --- */
    --r1:6px; --r2:10px; --r3:14px; --r4:20px; --rf:999px;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
    --eo: cubic-bezier(.2,.8,.25,1);
    --t-fast:140ms; --t-mid:220ms; --t-slow:320ms;
    --pad:20px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:      oklch(0.165 0.008 252);  /* graphite */
      --bg-2:    oklch(0.205 0.009 252);
      --bg-3:    oklch(0.235 0.010 252);
      --ink:     oklch(0.955 0.004 250);
      --mut:     oklch(0.745 0.008 252);
      --fnt:     oklch(0.615 0.009 252);
      --line:    oklch(0.305 0.009 252);
      --hair:    oklch(0.255 0.009 252);
      --acc:     oklch(0.755 0.145 162);
      --acc-ink: oklch(0.79 0.14 162);
      --acc-sf:  oklch(0.755 0.145 162 / .14);
      --warn:    oklch(0.80 0.13 72);
      --bad:     oklch(0.68 0.17 25);
      --btn:     oklch(0.955 0.004 250);
      --btn-ink: oklch(0.165 0.008 252);
      --shade:   oklch(0 0 0 / .3);
      --scrim:   oklch(0 0 0 / .5);
    }
  }
  :root[data-theme="dark"]{
    --bg:      oklch(0.165 0.008 252);
    --bg-2:    oklch(0.205 0.009 252);
    --bg-3:    oklch(0.235 0.010 252);
    --ink:     oklch(0.955 0.004 250);
    --mut:     oklch(0.745 0.008 252);
    --fnt:     oklch(0.615 0.009 252);
    --line:    oklch(0.305 0.009 252);
    --hair:    oklch(0.255 0.009 252);
    --acc:     oklch(0.755 0.145 162);
    --acc-ink: oklch(0.79 0.14 162);
    --acc-sf:  oklch(0.755 0.145 162 / .14);
    --warn:    oklch(0.80 0.13 72);
    --bad:     oklch(0.68 0.17 25);
    --btn:     oklch(0.955 0.004 250);
    --btn-ink: oklch(0.165 0.008 252);
    --shade:   oklch(0 0 0 / .3);
    --scrim:   oklch(0 0 0 / .5);
  }

  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg);color-scheme:light dark}
  body{
    font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text",Inter,system-ui,sans-serif;
    color:var(--ink);background:var(--bg);max-width:430px;margin:0 auto;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    overscroll-behavior-y:none;-webkit-touch-callout:none;
    padding-bottom:calc(72px + env(safe-area-inset-bottom))}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;
    user-select:none;-webkit-user-select:none}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  :focus{outline:none}
  :focus-visible{outline:2px solid var(--acc-ink);outline-offset:3px;border-radius:var(--r1)}
  [hidden]{display:none!important}
  @media (prefers-reduced-motion:reduce){
    *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;
      transition-duration:.01ms!important}
  }

  /* ---------- primitives ---------- */
  .ov{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
    color:var(--fnt);line-height:1.4}
  .disp{font-size:72px;font-weight:600;letter-spacing:-.04em;line-height:.92;
    font-variant-numeric:tabular-nums;user-select:text;-webkit-user-select:text}
  .disp .u{font-size:19px;font-weight:600;letter-spacing:0;color:var(--mut);margin-left:6px;
    vertical-align:baseline}
  .rule{height:1px;background:var(--line);border:0}
  .sec{padding:0 var(--pad)}
  .sech{display:flex;align-items:baseline;gap:var(--s2);padding:var(--s6) var(--pad) var(--s3)}
  .sech .ov{flex:1}

  /* hairline row list — the core structure, replaces cards */
  .rows{border-top:1px solid var(--line)}
  .row{display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;
    min-height:58px;padding:var(--s3) var(--pad);border-bottom:1px solid var(--hair);
    color:inherit;transition:background var(--t-fast) linear}
  .row:last-child{border-bottom:1px solid var(--line)}
  button.row:active,.row.tap:active{background:var(--bg-3)}
  .row .ri{width:21px;height:21px;flex:none;color:var(--fnt)}
  .row .ri svg{width:100%;height:100%;display:block}
  .row .rl{flex:1;min-width:0;font-size:15px;font-weight:500;letter-spacing:-.005em}
  .row .rl small{display:block;font-size:12px;font-weight:400;color:var(--fnt);margin-top:2px;
    letter-spacing:0}
  .row .rv{font-size:14px;font-weight:600;color:var(--mut);text-align:right;
    font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .row .rv.ok{color:var(--acc-ink)} .row .rv.warn{color:var(--warn)} .row .rv.bad{color:var(--bad)}
  .row .ch{flex:none;width:7px;height:12px;color:var(--fnt);opacity:.65}

  /* panel — used only where a chart or figure needs containment */
  .panel{background:var(--bg-2);border:1px solid var(--hair);border-radius:var(--r3);
    padding:var(--s4)}
  .panel+.panel{margin-top:var(--s3)}
  .plbl{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--fnt)}
  .pval{font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1;margin-top:10px;
    font-variant-numeric:tabular-nums}
  .pval .u{font-size:14px;font-weight:600;color:var(--mut);letter-spacing:0;margin-left:5px}
  .stats{display:flex;gap:var(--s5);margin-top:var(--s4);padding-top:var(--s3);
    border-top:1px solid var(--hair)}
  .stats>div{min-width:0}
  .stats b{display:block;font-size:16px;font-weight:600;letter-spacing:-.015em;
    font-variant-numeric:tabular-nums}
  .stats span{display:block;font-size:10px;font-weight:500;letter-spacing:.1em;
    text-transform:uppercase;color:var(--fnt);margin-top:4px}
  .note{font-size:12.5px;line-height:1.6;color:var(--fnt);margin-top:var(--s4);
    user-select:text;-webkit-user-select:text}

  /* ---------- hero ---------- */
  .hero{padding:max(var(--s5),calc(env(safe-area-inset-top) + var(--s2))) var(--pad) 0}
  .hbar{display:flex;align-items:center;gap:var(--s3);min-height:26px}
  .hbar .hm{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    color:var(--mut);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rf{width:30px;height:30px;margin-right:-6px;flex:none;display:flex;align-items:center;
    justify-content:center;color:var(--fnt);transition:transform var(--t-fast) var(--eo)}
  .rf:active{transform:scale(.86)}
  .rf svg{width:17px;height:17px}
  .rf.spin svg{animation:spin .8s var(--eo)}
  @keyframes spin{to{transform:rotate(360deg)}}

  .hdisp{margin-top:var(--s5)}
  .hlbl{margin-top:var(--s3)}
  .hmeta{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s4);
    padding-top:var(--s3);border-top:1px solid var(--line);
    font-size:11px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--mut)}
  .hmeta .dot{width:6px;height:6px;border-radius:50%;background:var(--fnt);flex:none}
  .hmeta .dot.on{background:var(--acc);box-shadow:0 0 0 3px var(--acc-sf)}
  .hmeta .sep{color:var(--line)}
  .hmeta .soc{font-variant-numeric:tabular-nums}
  .hmeta .when{margin-left:auto;color:var(--fnt);letter-spacing:.08em;text-transform:none;
    font-weight:500;font-size:11.5px}

  .hcar{display:block;width:100%;max-width:330px;margin:var(--s4) auto var(--s2);
    filter:drop-shadow(0 14px 22px var(--shade))}

  /* quick actions — hairline circles, labelled */
  .qa{display:flex;justify-content:center;gap:var(--s7);padding:var(--s2) var(--pad) var(--s5)}
  .qa button{display:flex;flex-direction:column;align-items:center;gap:9px;
    font-size:9.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--fnt);
    transition:color var(--t-mid) linear,opacity var(--t-mid) linear}
  .qa .qc{width:54px;height:54px;border-radius:50%;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--ink);
    background:var(--bg-2);
    transition:transform var(--t-fast) var(--eo),border-color var(--t-mid) linear,
      color var(--t-mid) linear,background var(--t-mid) linear}
  .qa button:active .qc{transform:scale(.9)}
  .qa button.busy{opacity:.4;pointer-events:none}
  .qa button.on{color:var(--acc-ink)}
  .qa button.on .qc{border-color:var(--acc);color:var(--acc-ink);background:var(--acc-sf)}
  .qa svg{width:23px;height:23px}

  /* live charging strip */
  .chg{display:flex;align-items:center;gap:var(--s2);padding:13px var(--pad);
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    background:var(--acc-sf);color:var(--acc-ink);
    font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
  .chg svg{width:13px;height:13px;flex:none}
  .chg .dim{margin-left:auto;color:var(--mut);letter-spacing:.06em;text-transform:none;
    font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}

  /* inline stepper on the climate row */
  .step{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--line);
    color:var(--ink);font-size:17px;font-weight:500;line-height:1;
    display:flex;align-items:center;justify-content:center;background:var(--bg-2);
    transition:transform var(--t-fast) var(--eo),border-color var(--t-mid) linear}
  .step:active{transform:scale(.88);border-color:var(--acc)}
  .step:disabled{opacity:.3}
  .stepset{display:flex;align-items:center;gap:var(--s3);flex:none}
  .stepset .tv{font-size:19px;font-weight:600;letter-spacing:-.02em;min-width:44px;text-align:center;
    font-variant-numeric:tabular-nums}

  /* ---------- tab bar ---------- */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;max-width:430px;margin:0 auto;
    background:var(--bg);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom)}
  @supports (backdrop-filter:blur(1px)){
    .tabbar{background:color-mix(in oklab,var(--bg) 82%,transparent);
      -webkit-backdrop-filter:saturate(1.4) blur(20px);backdrop-filter:saturate(1.4) blur(20px)}
  }
  .tabbar button{flex:1;padding:11px 0 9px;display:flex;flex-direction:column;align-items:center;gap:5px;
    color:var(--fnt);transition:color var(--t-mid) linear}
  .tabbar button.on{color:var(--ink)}
  .tabbar svg{width:21px;height:21px}
  .tabbar span{font-size:9.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase}

  /* ---------- detail page (slide-over, nav model preserved) ---------- */
  .page{position:fixed;inset:0;z-index:60;background:var(--bg);max-width:430px;margin:0 auto;
    transform:translate3d(100%,0,0);visibility:hidden;
    transition:transform var(--t-slow) var(--eo),visibility 0s linear var(--t-slow);
    overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding-bottom:calc(var(--s7) + env(safe-area-inset-bottom))}
  .page.open{transform:none;visibility:visible;transition:transform var(--t-slow) var(--eo),visibility 0s}
  .page.drag{transition:none}
  .phead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:var(--s3);
    padding:max(var(--s4),calc(env(safe-area-inset-top) + var(--s2))) var(--pad) var(--s3);
    border-bottom:1px solid var(--line);background:var(--bg)}
  @supports (backdrop-filter:blur(1px)){
    .phead{background:color-mix(in oklab,var(--bg) 84%,transparent);
      -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
  }
  .phead h2{flex:1;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
    color:var(--mut)}
  .pback{width:30px;height:30px;margin-left:-7px;flex:none;display:flex;align-items:center;
    justify-content:center;color:var(--ink);transition:transform var(--t-fast) var(--eo)}
  .pback:active{transform:translateX(-2px)}
  .pback svg{width:9px;height:16px}
  .pbody{padding:var(--s5) var(--pad) 0}
  .pbody .rows{margin:0 calc(var(--pad) * -1)}

  /* top-view diagram for doors / tyres */
  .topwrap{position:relative;width:232px;margin:var(--s2) auto var(--s3)}
  .topwrap svg{width:100%;display:block;overflow:visible}
  /* tyres carry the only colour on the diagram, so state reads at a glance */
  .wh{fill:var(--bg-3);stroke:var(--line);stroke-width:1.4}
  .wh.ok{fill:var(--acc-sf);stroke:var(--acc);stroke-width:1.8}
  .wh.warn{fill:oklch(0.7 0.14 70 / .16);stroke:var(--warn);stroke-width:1.8}
  .wh.bad{fill:oklch(0.6 0.18 27 / .16);stroke:var(--bad);stroke-width:1.8}
  .whc{fill:var(--fnt);font-size:7.5px;font-weight:600;letter-spacing:.12em}
  .whv{font-size:11px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;
    fill:var(--mut)}
  .whv.ok{fill:var(--acc-ink)} .whv.warn{fill:var(--warn)} .whv.bad{fill:var(--bad)}
  /* caption directly under the diagram, explaining what the four shapes mean */
  .topcap{text-align:center;font-size:11.5px;line-height:1.5;color:var(--fnt);
    margin:0 auto var(--s5);max-width:290px}
  .topcap b{color:var(--mut);font-weight:600}

  .ckc{display:inline-flex;align-items:center;gap:6px}
  .ckc svg{width:13px;height:13px;flex:none}

  /* primary action */
  .bigbtn{display:block;width:100%;margin-top:var(--s5);background:var(--btn);color:var(--btn-ink);
    border-radius:var(--r2);padding:16px;font-size:11px;font-weight:600;letter-spacing:.16em;
    text-transform:uppercase;transition:transform var(--t-fast) var(--eo),opacity var(--t-mid) linear}
  .bigbtn:active{transform:scale(.985)}
  .bigbtn:disabled{opacity:.35}

  /* A/C page */
  .acbig{display:flex;align-items:center;justify-content:center;gap:var(--s5);margin:var(--s7) 0 var(--s3)}
  .acbig .cur{font-size:76px;font-weight:600;letter-spacing:-.045em;line-height:.9;
    font-variant-numeric:tabular-nums}
  .acbig .cur u{font-size:20px;font-weight:600;color:var(--mut);text-decoration:none;letter-spacing:0}
  .acbig .side{font-size:22px;font-weight:500;color:var(--line);font-variant-numeric:tabular-nums}
  .acsub{text-align:center;margin-bottom:var(--s2)}
  .acrow{display:flex;justify-content:center;gap:var(--s5);margin-bottom:var(--s7)}
  .acacts{display:flex;justify-content:center;gap:var(--s7);padding-top:var(--s5);
    border-top:1px solid var(--line)}
  .acacts button{display:flex;flex-direction:column;align-items:center;gap:9px;
    font-size:9.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--fnt);
    transition:color var(--t-mid) linear}
  .acacts .cic{width:54px;height:54px;border-radius:50%;border:1px solid var(--line);
    background:var(--bg-2);display:flex;align-items:center;justify-content:center;color:var(--ink);
    transition:transform var(--t-fast) var(--eo),border-color var(--t-mid) linear,
      color var(--t-mid) linear,background var(--t-mid) linear}
  .acacts button:active .cic{transform:scale(.9)}
  .acacts button.on{color:var(--acc-ink)}
  .acacts button.on .cic{border-color:var(--acc);color:var(--acc-ink);background:var(--acc-sf)}
  .acacts .cic svg{width:23px;height:23px}

  /* charts */
  #echart,#cchart{display:block;width:100%;margin-top:var(--s3);overflow:visible}
  .cstats{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2);margin-top:var(--s4);
    padding-top:var(--s3);border-top:1px solid var(--hair)}
  .cstats b{display:block;font-size:16px;font-weight:600;letter-spacing:-.015em;
    font-variant-numeric:tabular-nums}
  .cstats span{display:block;font-size:9px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
    color:var(--fnt);margin-top:4px}
  .crange{font-size:12px;color:var(--fnt);margin-top:var(--s3);line-height:1.6;
    font-variant-numeric:tabular-nums}

  .socbar{height:4px;border-radius:var(--rf);background:var(--line);overflow:hidden;margin-top:var(--s4)}
  .socbar i{display:block;height:100%;border-radius:var(--rf);background:var(--acc);
    transition:width .9s var(--eo)}

  .hrow2{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3);
    padding:13px 0;border-top:1px solid var(--hair);font-size:12.5px;color:var(--fnt);
    font-variant-numeric:tabular-nums}
  .hrow2:first-child{border-top:0}
  .hrow2 b{color:var(--ink);font-weight:600}

  /* calendar */
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s4)}
  .calhead b{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
  .calnav{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);color:var(--ink);
    display:flex;align-items:center;justify-content:center;background:var(--bg-2);
    transition:transform var(--t-fast) var(--eo)}
  .calnav:active{transform:scale(.88)}
  .calnav svg{width:8px;height:13px}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .caldow{text-align:center;font-size:9.5px;font-weight:600;color:var(--fnt);letter-spacing:.11em;
    text-transform:uppercase;padding-bottom:var(--s1)}
  .calday{background:var(--bg-2);border:1px solid var(--hair);border-radius:var(--r1);
    padding:6px 2px;text-align:center;min-height:50px;position:relative;overflow:hidden;
    font:inherit;color:var(--ink);transition:transform var(--t-fast) var(--eo)}
  .calday.on:active{transform:scale(.92)}
  .calday.off{opacity:.4;pointer-events:none;background:transparent}
  .calday .cd{position:relative;z-index:1;font-size:10px;font-weight:500;color:var(--fnt);display:block;
    font-variant-numeric:tabular-nums}
  .calday .ck{position:relative;z-index:1;font-size:12px;font-weight:600;display:block;margin-top:3px;
    letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .calday .cdot{position:absolute;z-index:1;top:5px;right:5px;width:4px;height:4px;border-radius:50%;
    background:var(--acc)}
  .calwash{position:absolute;inset:0;background:var(--acc);pointer-events:none}
  .caltot{display:flex;gap:var(--s5);margin-top:var(--s5);padding-top:var(--s4);
    border-top:1px solid var(--line)}
  .caltot>div{min-width:0}
  .caltot b{display:block;font-size:16px;font-weight:600;letter-spacing:-.015em;
    font-variant-numeric:tabular-nums}
  .caltot span{display:block;font-size:9.5px;font-weight:500;letter-spacing:.11em;text-transform:uppercase;
    color:var(--fnt);margin-top:4px}

  /* account header + share card */
  .vveh{padding:0 0 var(--s5);border-bottom:1px solid var(--line);position:relative}
  .vveh .vm{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
  .vveh .vo{font-size:46px;font-weight:600;letter-spacing:-.04em;line-height:1;margin-top:var(--s4);
    font-variant-numeric:tabular-nums}
  .vveh .vo u{font-size:14px;font-weight:600;color:var(--mut);text-decoration:none;letter-spacing:0;
    margin-left:5px}
  .vveh .vv{font-size:11.5px;color:var(--fnt);margin-top:10px;letter-spacing:.06em;
    font-variant-numeric:tabular-nums;user-select:text;-webkit-user-select:text}
  .vveh .ve{position:absolute;top:0;right:-6px;width:30px;height:30px;display:flex;
    align-items:center;justify-content:center;color:var(--fnt)}
  .vveh .ve svg{width:17px;height:17px}
  .vveh img{display:block;width:100%;max-width:250px;margin:var(--s3) auto 0;
    filter:drop-shadow(0 10px 16px var(--shade))}

  .flexc{border:1px solid var(--line);border-radius:var(--r3);padding:var(--s5);background:var(--bg-2)}
  .flexc .fm{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--fnt)}
  .flexc .fbig{font-size:56px;font-weight:600;letter-spacing:-.04em;line-height:.95;margin:var(--s4) 0 0;
    font-variant-numeric:tabular-nums}
  .flexc .fbig u{display:block;font-size:10px;font-weight:600;color:var(--fnt);text-decoration:none;
    letter-spacing:.18em;text-transform:uppercase;margin-top:10px}
  .fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4);margin-top:var(--s5);
    padding-top:var(--s4);border-top:1px solid var(--hair)}
  .fgrid2 b{display:block;font-size:18px;font-weight:600;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums}
  .fgrid2 span{display:block;font-size:9.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
    color:var(--fnt);margin-top:4px}

  /* segmented control */
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r1);overflow:hidden;
    flex:none;background:var(--bg)}
  .seg button{padding:6px 11px;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    color:var(--fnt);transition:background var(--t-mid) linear,color var(--t-mid) linear}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--btn);color:var(--btn-ink)}

  /* confirm sheet — replaces native confirm() */
  .scrim{position:fixed;inset:0;z-index:88;background:var(--scrim);opacity:0;pointer-events:none;
    transition:opacity var(--t-mid) linear}
  .scrim.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:90;max-width:430px;margin:0 auto;
    background:var(--bg-2);border-top:1px solid var(--line);
    border-radius:var(--r4) var(--r4) 0 0;
    padding:var(--s5) var(--pad) calc(var(--s5) + env(safe-area-inset-bottom));
    transform:translate3d(0,110%,0);transition:transform var(--t-slow) var(--eo)}
  .sheet.show{transform:none}
  .sheet .sq{font-size:17px;font-weight:600;letter-spacing:-.015em;text-align:center}
  .sheet .ss{font-size:12.5px;color:var(--fnt);text-align:center;margin-top:var(--s2);line-height:1.5}
  .sheet .sb{display:flex;gap:var(--s3);margin-top:var(--s5)}
  .sheet .sb button{flex:1;padding:15px;border-radius:var(--r2);font-size:11px;font-weight:600;
    letter-spacing:.16em;text-transform:uppercase;transition:transform var(--t-fast) var(--eo)}
  .sheet .sb button:active{transform:scale(.985)}
  .sheet .no{border:1px solid var(--line);color:var(--ink)}
  .sheet .yes{background:var(--btn);color:var(--btn-ink)}

  .toast{position:fixed;left:var(--pad);right:var(--pad);bottom:calc(88px + env(safe-area-inset-bottom));
    max-width:390px;margin:0 auto;
    background:var(--btn);color:var(--btn-ink);font-size:12.5px;font-weight:500;line-height:1.45;
    padding:13px 16px;border-radius:var(--r2);text-align:center;
    opacity:0;transform:translate3d(0,10px,0);pointer-events:none;
    transition:opacity var(--t-mid) linear,transform var(--t-slow) var(--eo);z-index:80}
  .toast.show{opacity:1;transform:none}

  .fadein{animation:fadein var(--t-slow) var(--eo)}
  @keyframes fadein{from{opacity:0;transform:translate3d(0,6px,0)}}

  /* ---------- motion detail ----------
     Restrained, state-bearing only: a first-paint rise, a needle-style count on the
     numerals, a drawn chart line, a live pulse. Nothing loops unless the car is
     actually doing something. All transform/opacity; the reduced-motion block above
     flattens every one of these, and the JS count-up checks the same query. */
  .rise{animation:rise 420ms var(--eo) both}
  @keyframes rise{from{opacity:0;transform:translate3d(0,10px,0)}}

  /* live dot: a single expanding ring, only while the car is online */
  .hmeta .dot{position:relative}
  .hmeta .dot.on:after{content:"";position:absolute;inset:0;border-radius:50%;
    border:1px solid var(--acc);animation:ping 2.8s var(--eo) infinite}
  @keyframes ping{0%{transform:scale(1);opacity:.7}70%,100%{transform:scale(3.4);opacity:0}}

  /* charging bolt breathes while a session is live */
  .chg svg{animation:breathe 2.6s ease-in-out infinite}
  @keyframes breathe{50%{opacity:.42}}

  /* chart line draws itself in */
  .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);
    animation:draw 760ms var(--eo) 60ms forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .drawf{opacity:0;animation:drawf 520ms linear 420ms forwards}
  @keyframes drawf{to{opacity:1}}

  /* a value that changed on the last poll warms for a moment */
  .rv,.hmeta .soc{transition:color 620ms linear}
  .rv.flash,.hmeta .soc.flash{color:var(--acc-ink);transition:color 90ms linear}
</style>

<!-- DIRECTION CONTRACT (v2, "Instrument", 2026-09-11)
THESIS: A well-made gauge, not an app screen. The range numeral is the whole first viewport; everything
else is a hairline list beneath it. Refuses both the stat-tile dashboard and the card-grid car app.
OWN-WORLD: instrument register — graphite in dark, cool paper in light, adaptive by system with a manual
override. Structure comes from hairlines and whitespace; there are no cards except where a chart needs
containment. One accent (product green) carries state only. No gradients, no glass, no shadows as decoration.
TYPE: one family, weight range 400/500/600 only (no 800). Display numerals at 72px / -0.04em with tabular
figures; labels are 10px uppercase at 0.18em tracking. Numbers are the loudest thing on every screen.
STORY: owner opens from the iPhone home screen, reads range in under a second, fires lock or A/C without
reading, walks one level down into doors, tyres, climate or energy.
NAV (unchanged from the previous v2): two tabs, right-slide detail pages, deep links at #doors #tyres etc.
Added: edge-swipe back, hardware back via history, Esc, and a confirm sheet in place of window.confirm.
HONESTY inherited: windows row hidden on the J5 (byte 8 quirk, #5), indirect-TPMS cars get status only,
seats read "Not available" when the car reports none.
A11Y: --mut ~5.6:1 and --fnt ~4.8:1 on light; both above 4.5:1 in dark. Text selection allowed on data.
MOTION: one ease token, 140/220/320ms, transform and opacity only, prefers-reduced-motion honored. -->

<script>
const $ = id => document.getElementById(id);
let S = null, CAPS = null;
async function api(p, opt){ const r = await fetch(p, opt); if(r.status === 401){ location.href = '/'; throw 0; } return r.json(); }
let toastT = null;
function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800); }

/* ---- theme: auto by default, manual override persisted per device ---- */
const THEME_DARK = '#101214', THEME_LIGHT = '#f7f7f8';
function readTheme(){ try{ return localStorage.getItem('theme') || 'auto'; }catch(e){ return 'auto'; } }
function applyTheme(t){
  const root = document.documentElement;
  if(t === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', t);
  const dark = t === 'dark' ||
    (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  $('themeColor').setAttribute('content', dark ? THEME_DARK : THEME_LIGHT);
}
function setTheme(t){ try{ localStorage.setItem('theme', t); }catch(e){} applyTheme(t); }
applyTheme(readTheme());
if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)')
  .addEventListener('change', () => { if(readTheme() === 'auto') applyTheme('auto'); });

/* ---- confirm sheet: replaces window.confirm, which blocks the PWA ---- */
let shResolve = null;
function ask(q, s){
  $('shQ').textContent = q; $('shS').textContent = s || '';
  $('shS').hidden = !s;
  $('scrim').classList.add('show'); $('sheet').classList.add('show');
  return new Promise(res => { shResolve = res; });
}
function askClose(v){
  $('scrim').classList.remove('show'); $('sheet').classList.remove('show');
  if(shResolve){ shResolve(v); shResolve = null; }
}
$('shNo').onclick = () => askClose(false);
$('scrim').onclick = () => askClose(false);
$('shYes').onclick = () => askClose(true);

// stroke icon glyphs — 24px round-stroke set, 1.8 weight, no fills except accents
const IC = {
  lock:    '<rect x="5" y="10.5" width="14" height="9.5" rx="2.6"/><path d="M8 10.5V7a4 4 0 018 0v3.5"/><circle cx="12" cy="15" r="1.4"/>',
  unlock:  '<rect x="5" y="10.5" width="14" height="9.5" rx="2.6"/><path d="M8 10.5V7a4 4 0 017.6-2"/><circle cx="12" cy="15" r="1.4"/>',
  find:    '<circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/><path d="M7.9 7.9a5.8 5.8 0 000 8.2M16.1 16.1a5.8 5.8 0 000-8.2M5 5a9.5 9.5 0 000 14M19 19a9.5 9.5 0 000-14"/>',
  ac:      '<circle cx="12" cy="12" r="2"/><path d="M12 10c0-3.2.4-6 2-6s3 2.2 1.8 4.2S12 10 12 10M14 12c3.2 0 6 .4 6 2s-2.2 3-4.2 1.8S14 12 14 12M12 14c0 3.2-.4 6-2 6s-3-2.2-1.8-4.2S12 14 12 14M10 12c-3.2 0-6-.4-6-2s2.2-3 4.2-1.8S10 12 10 12"/>',
  cool:    '<path d="M12 2.5v19M4.2 7l15.6 10M19.8 7L4.2 17"/><path d="M9.2 4l2.8 2.6L14.8 4M9.2 20l2.8-2.6L14.8 20M3.4 9.6L6.2 12l-2.8 2.4M20.6 9.6L17.8 12l2.8 2.4"/>',
  heat:    '<circle cx="12" cy="12" r="3.6"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5 5l2.1 2.1M16.9 16.9L19 19M19 5l-2.1 2.1M7.1 16.9L5 19"/>',
  power:   '<path d="M12 3v9"/><path d="M6.6 6.6a8 8 0 1010.8 0"/>',
  bolt:    '<path d="M13 2L4 14h6l-1 8 9-12h-6z" fill="currentColor" stroke="none"/>',
  door:    '<path d="M3 19.5h18"/><path d="M5 19.5v-6.8l2.8-5.2h6.4l2.3 5.2v6.8"/><path d="M7.8 12.7h6.9"/><circle cx="9" cy="15.8" r="0.9" fill="currentColor" stroke="none"/>',
  tyre:    '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.2"/><path d="M12 3.5v5.3M12 15.2v5.3M3.5 12h5.3M15.2 12h5.3"/>',
  chart:   '<path d="M4 19.5h16"/><path d="M4 15l4-5 4 3 5-7"/><circle cx="17" cy="6" r="1.2" fill="currentColor" stroke="none"/>',
  seat:    '<path d="M7 3.2a2 2 0 014 0V10h4.5a2 2 0 012 2v5.5"/><path d="M7 10v3a3 3 0 003 3h8.5"/><path d="M5 21l1.2-4M18.5 21v-3.5"/>',
  car:     '<path d="M4 16l1.8-5.3A3 3 0 018.6 8.7h6.8a3 3 0 012.8 2L20 16"/><rect x="3" y="16" width="18" height="4" rx="1.6"/><circle cx="7.5" cy="18" r="1.4" fill="currentColor" stroke="none"/><circle cx="16.5" cy="18" r="1.4" fill="currentColor" stroke="none"/>',
  globe:   '<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/>',
  gauge:   '<path d="M4 18a8 8 0 0116 0"/><path d="M12 18l4.5-6.5"/><circle cx="12" cy="18" r="1.5" fill="currentColor" stroke="none"/><path d="M4 18h1.5M18.5 18H20"/>',
  camera:  '<path d="M3 9.5A2.5 2.5 0 015.5 7h1.2l1.1-2h6.4l1.1 2h1.2A2.5 2.5 0 0120 9.5v8A2.5 2.5 0 0117.5 20h-11A2.5 2.5 0 014 17.5z"/><circle cx="12" cy="13" r="3.4"/>',
  link:    '<path d="M9 15l6-6"/><path d="M11.5 6.5l1.4-1.4a4 4 0 015.6 5.6L17 12"/><path d="M12.5 17.5l-1.4 1.4a4 4 0 01-5.6-5.6L7 12"/>',
  moon:    '<path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/>',
};
function icon(k, w){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (w || 1.8) +
  '" stroke-linecap="round" stroke-linejoin="round">' + (IC[k] || '') + '</svg>'; }
const CHEV = '<svg class="ch" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg>';

const CK_OK  = '<span class="ckc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6"/></svg>';
const CK_BAD = '<span class="ckc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5.5v8.5"/><circle cx="12" cy="18.4" r="1.3" fill="currentColor" stroke="none"/></svg>';

/* ---- motion helpers ----
   The design contract allows motion that carries state and nothing else, so each of
   these is tied to a real event: a value arriving, a value changing, a page painting. */
const REDUCED = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

// needle-style count toward a new reading. Tabular figures keep the width steady.
function countTo(el, to, dur){
  const from = parseFloat(String(el.textContent).replace(/[^\d.-]/g, ''));
  if(to == null || isNaN(to)){ el.textContent = '—'; return; }
  if(isNaN(from) || from === to || REDUCED()){ el.textContent = to; return; }
  const t0 = performance.now(), d = dur || 620, span = to - from;
  cancelAnimationFrame(el._raf);
  const tick = now => {
    const p = Math.min(1, (now - t0) / d);
    const e = 1 - Math.pow(1 - p, 3);                 // ease-out cubic
    el.textContent = Math.round(from + span * e);
    if(p < 1) el._raf = requestAnimationFrame(tick);
  };
  el._raf = requestAnimationFrame(tick);
}

// warm a value for a moment when the poll actually changed it. The rows are rebuilt
// from innerHTML on every load, so the previous reading is kept here, not on the node.
const PREV = {};
function flash(el, key, next){
  const v = String(next);
  const changed = PREV[key] !== undefined && PREV[key] !== v;
  PREV[key] = v;
  if(!changed || REDUCED()) return;
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 700);
}

// first-paint rise, one small stagger, never on a re-poll
function stagger(nodes, step, base){
  if(REDUCED()) return;
  nodes.forEach((n, i) => {
    n.style.animationDelay = ((base || 0) + i * (step || 34)) + 'ms';
    n.classList.add('rise');
  });
}

// let a chart stroke draw itself, then fade in its labels and dots
function drawIn(svg){
  if(!svg || REDUCED()) return;
  svg.querySelectorAll('polyline,path').forEach(p => {
    if(p.getAttribute('fill') !== 'none' && p.getAttribute('fill')){ p.classList.add('drawf'); return; }
    let len = 0;
    try{ len = p.getTotalLength(); }catch(e){ return; }
    if(!len) return;
    p.style.setProperty('--len', len.toFixed(1));
    p.classList.add('draw');
  });
  svg.querySelectorAll('circle,text,line').forEach(n => n.classList.add('drawf'));
}

function ago(dt){ if(!dt) return ''; const s = (Date.now() - new Date(dt.replace(' ', 'T'))) / 1000;
  if(s < 90) return 'just now'; if(s < 3600) return Math.round(s / 60) + ' min ago';
  if(s < 86400) return Math.round(s / 3600) + ' h ago'; return Math.round(s / 86400) + ' d ago'; }

// ---- remote control: same pipe as v1 (init 77, then fire) ----
async function fire(op, btn){
  if(btn) btn.classList.add('busy');
  try{
    await api('/api/control', {method: 'POST', headers: {'content-type': 'application/json'},
      body: JSON.stringify({data: '77', timeOut: 20})});
    await new Promise(r => setTimeout(r, 600));
    const d = await api('/api/control', {method: 'POST', headers: {'content-type': 'application/json'},
      body: JSON.stringify({data: op, timeOut: 20})});
    if(d.ok){ toast('Sent ' + op); setTimeout(load, 1800); }
    else if(String(d.code) === '50043') toast('Car is asleep or out of signal');
    else toast(d.msg || d.error || ('Failed: ' + d.code));
  }catch(e){ toast('Network error'); }
  if(btn) btn.classList.remove('busy');
}

// windows byte: 0 = all closed (E5-verified). On the J5 it reads 16 while parked for unknown
// reasons (model-specific, #5), so on a J5 we refuse to guess and report null.
function windowsOpen(){
  if(S.windows == null) return null;
  const m = ((S.vehicle && S.vehicle.model) || '').toLowerCase();
  if(m.indexOf('j5') >= 0 || m.indexOf('jaecoo') >= 0) return null;
  return S.windows !== 0;
}

function doorSummary(){
  const parts = [];
  const openDoors = S.doors == null ? null : (S.doors & 15) !== 0;
  const winOpen = windowsOpen();
  if(openDoors) parts.push('Door open');
  if(winOpen === true) parts.push('Windows open');
  if(S.trunk_open) parts.push('Trunk open');
  if(S.sunroof_open) parts.push('Sunroof open');
  if(!parts.length && openDoors === false && !S.unlocked) return {t: 'Closed, locked', cls: 'ok'};
  if(!parts.length) return {t: S.unlocked ? 'Unlocked' : 'Closed', cls: S.unlocked ? 'warn' : 'ok'};
  return {t: parts.join(' · '), cls: 'bad'};
}

function renderCharging(){

let acTarget = 24, acTimer = null;
function sendTemp(){
  // 7411 + temp as one hex byte (#11, jump table). Encoding is integer degC, pending runtime
  // verification; debounced so stepping does not spam the car.
  clearTimeout(acTimer);
  acTimer = setTimeout(() => fire('7411' + Math.round(acTarget).toString(16).padStart(2, '0')), 800);
}
function renderAc(){
  const el = $('pgAcBody');
  const caps = (CAPS && CAPS.ac) || {};
  const mn = caps.min != null ? Math.ceil(caps.min) : 16;
  const mx = caps.max != null ? Math.floor(caps.max) : 30;
  const cabin = S.ac_temp_c && S.ac_temp_c < 60 ? S.ac_temp_c + '°C' : null;
  el.innerHTML =
    '<div class="acsub ov">' + (cabin ? 'Cabin now ' + cabin : 'Set a target, then power on') + '</div>' +
    '<div class="acbig"><span class="side">' + Math.max(mn, acTarget - 1) + '</span>' +
    '<span class="cur num">' + acTarget + '<u>°C</u></span>' +
    '<span class="side">' + Math.min(mx, acTarget + 1) + '</span></div>' +
    '<div class="acrow">' +
      '<button class="step" id="acMinus" aria-label="Cooler">&minus;</button>' +
      '<button class="step" id="acPlus" aria-label="Warmer">+</button></div>' +
    '<div class="acacts">' +
    '<button data-ac="heat"><span class="cic">' + icon('heat') + '</span>Heat</button>' +
    '<button data-ac="cool"><span class="cic">' + icon('cool') + '</span>Cool</button>' +
    '<button data-ac="pwr"><span class="cic">' + icon('power') + '</span><span id="acPwrLbl">' +
      (S.ac_on ? 'Turn off' : 'Turn on') + '</span></button></div>' +
    '<div class="note">Temperature command (7411 + hex) comes from the jump-table decode and is pending ' +
    'on-car verification. Power and quick heat/cool use the verified map.</div>';
  $('acMinus').onclick = () => { acTarget = Math.max(mn, acTarget - 1); renderAc(); sendTemp(); };
  $('acPlus').onclick  = () => { acTarget = Math.min(mx, acTarget + 1); renderAc(); sendTemp(); };
  el.querySelector('[data-ac="heat"]').onclick = () => fire(S.ac_on ? '741F00' : '741F01');
  el.querySelector('[data-ac="cool"]').onclick = () => fire(S.ac_on ? '742000' : '742001');
  el.querySelector('[data-ac="pwr"]').onclick  = () => fire(S.ac_on ? '741000' : '741001');
  el.querySelector('[data-ac="pwr"]').classList.toggle('on', !!S.ac_on);
}

// Top view of the car. `wheels` is optional: either one class applied to all four (a car that
// reports a single overall status, like this one) or an array of four in FL, FR, RL, RR order
// (a car with real per-wheel sensors). `vals` is the matching per-wheel label, if any.
const WHEEL_XY = [[11, 38], [97, 38], [11, 124], [97, 124]];   // FL, FR, RL, RR
const WHEEL_POS = ['FL', 'FR', 'RL', 'RR'];
function topCarSvg(wheels, vals){
  const cls = i => 'wh' + (wheels ? ' ' + (Array.isArray(wheels) ? (wheels[i] || '') : wheels) : '');
  let w = '';
  WHEEL_XY.forEach((p, i) => {
    const left = p[0] < 60;
    const tx = left ? p[0] - 4 : p[0] + 16;      // labels sit outside the wheel
    const anc = left ? 'end' : 'start';
    w += '<rect class="' + cls(i) + '" x="' + p[0] + '" y="' + p[1] + '" width="12" height="30" rx="4.5"/>' +
      '<text class="whc" x="' + tx + '" y="' + (p[1] + 12) + '" text-anchor="' + anc + '">' +
        WHEEL_POS[i] + '</text>';
    if(vals && vals[i])
      w += '<text class="whv ' + (Array.isArray(wheels) ? (wheels[i] || '') : (wheels || '')) +
        '" x="' + tx + '" y="' + (p[1] + 25) + '" text-anchor="' + anc + '">' + vals[i] + '</text>';
  });
  return '<svg viewBox="-16 4 152 182">' + w +
    '<path d="M38 12C31 12 27 22 26 36L24 148C24 166 29 178 39 178h42c10 0 15-12 15-30l-2-112C94 22 89 12 82 12Z" ' +
      'fill="var(--bg-2)" stroke="var(--line)" stroke-width="1.5"/>' +
    '<path d="M31 52C33 40 37 33 43 31h34c6 2 10 9 12 21-8-4-18-6-29-6s-21 2-29 6Z" fill="var(--bg-3)" ' +
      'stroke="var(--line)" stroke-width="1"/>' +
    '<rect x="37" y="70" width="46" height="58" rx="7" fill="var(--bg-3)" stroke="var(--line)" stroke-width="1"/>' +
    '<path d="M26 76h-6v10h6M94 76h6v10h-6" fill="var(--line)"/></svg>';
}

function renderTyres(){
  const el = $('pgTyresBody');
  const t = S.tpms || [];
  const unit = S.tyre_unit || 'psi';
  const indirect = S.tyre_indirect !== false;
  const ok = S.tyre_status === 'Normal';

  // Two honest cases. With real per-wheel sensors each tyre is coloured and labelled from its own
  // reading. With indirect TPMS the car reports ONE status for the whole vehicle, so all four are
  // drawn in the same state and the caption says so — four different colours here would be a lie.
  let wheels, vals = null, cap;
  if(indirect){
    wheels = ok ? 'ok' : 'bad';
    cap = ok
      ? 'All four reading <b>normal</b>. This car reports one status for the whole vehicle, not four pressures.'
      : 'The car is reporting <b>a problem</b> but cannot say which wheel. Check all four by hand.';
  } else {
    wheels = t.map(w => w.psi == null ? '' : ((w.psi < 28 || w.psi > 40) ? 'bad' : 'ok'));
    vals = t.map(w => w.psi == null ? '' : Math.round(w.psi) + ' ' + unit);
    const known = t.filter(w => w.psi != null).length;
    cap = known ? 'Live pressure from each wheel sensor.' : 'No wheel sensor has reported yet.';
  }

  el.innerHTML = '<div class="topwrap">' + topCarSvg(wheels, vals) + '</div>' +
    '<div class="topcap">' + cap + '</div>' +
    '<div class="rows"><div class="row"><span class="rl">Status</span><span class="rv ' +
      (ok ? 'ok' : 'bad') + '">' +
      (ok ? CK_OK : CK_BAD) + (S.tyre_status || '—') + '</span></span></div>' +
      (S.tpms_age_min != null ? '<div class="row"><span class="rl">Last wheel frame</span>' +
        '<span class="rv">' + S.tpms_age_min + ' min ago</span></div>' : '') +
    '</div>' +
    '<div class="note">' + (indirect
      ? 'This car uses indirect TPMS: it infers a soft tyre from wheel speed rather than from pressure ' +
        'sensors, so it can only report normal or not. Per-wheel pressures appear here on cars with real ' +
        'sensors.'
      : 'Pressures from the last frame that carried live sensors.') + '</div>';
}

function renderEnergy(){
  const el = $('pgEnergyBody');
  const e = S.energy || {};
  const hist = S.history || [];
  const wltp = S.wltp_kwh_100;
  el.innerHTML =
    '<div class="panel"><div class="plbl">Recent average</div>' +
    '<div class="pval num">' + (e.consumption != null ? e.consumption : '—') +
      '<span class="u">kWh/100km</span></div>' +
    '<div class="stats">' +
      '<div><b class="num">' + (S.km && S.km.today != null ? S.km.today : '—') + '</b><span>km today</span></div>' +
      '<div><b class="num">' + (e.today_kwh != null ? e.today_kwh : '—') + '</b><span>kWh today</span></div>' +
      '<div><b class="num">' + (S.km && S.km.week != null ? S.km.week : '—') + '</b><span>km / week</span></div>' +
    '</div></div>' +
    '<div class="sech" style="padding-left:0;padding-right:0"><span class="ov">Past 7 days</span></div>' +
    '<div class="panel"><svg id="echart" viewBox="0 0 340 150"></svg></div>';
  const svg = $('echart');
  const W = 340, H = 150, P = 26;
  const vals = hist.map(h => (h.eff == null ? null : h.eff));
  const present = vals.filter(v => v != null);
  const maxV = Math.max(20, ...present, wltp || 0) * 1.15;
  const xs = i => P + i * (W - P - 26) / 6;
  const ys = v => H - P - (v / maxV) * (H - P - 14);
  const segs = [];
  let cur = null;
  vals.forEach((v, i) => {
    if(v == null){ cur = null; return; }
    if(!cur){ cur = []; segs.push(cur); }
    cur.push(i);
  });
  let path = '', area = '', dots = '';
  segs.forEach(seg => {
    seg.forEach((i, j) => {
      const v = vals[i];
      const cmd = (j ? 'L' : 'M') + xs(i).toFixed(1) + ' ' + ys(v).toFixed(1);
      path += cmd; area += cmd;
      dots += '<circle cx="' + xs(i) + '" cy="' + ys(v) + '" r="2.6" fill="var(--acc)"/>' +
        '<text x="' + xs(i) + '" y="' + (ys(v) - 9) + '" font-size="9.5" text-anchor="middle" ' +
        'fill="var(--mut)" font-weight="600">' + v + '</text>';
    });
    area += 'L' + xs(seg[seg.length - 1]) + ' ' + (H - P) + 'L' + xs(seg[0]) + ' ' + (H - P) + 'Z';
  });
  let wl = '';
  if(wltp){
    wl = '<line x1="' + P + '" y1="' + ys(wltp) + '" x2="' + (W - 26) + '" y2="' + ys(wltp) +
      '" stroke="var(--fnt)" stroke-dasharray="4 5" stroke-width="1.2"/>' +
      '<text x="' + (P) + '" y="' + (ys(wltp) - 6) + '" font-size="8.5" text-anchor="start" ' +
      'letter-spacing="1" fill="var(--fnt)">WLTP ' + wltp + '</text>';
  }
  const base = '<line x1="' + P + '" y1="' + (H - P) + '" x2="' + (W - 26) + '" y2="' + (H - P) +
    '" stroke="var(--line)" stroke-width="1"/>';
  const days = hist.map((h, i) =>
    '<text x="' + xs(i) + '" y="' + (H - 8) + '" font-size="8.5" text-anchor="middle" ' +
    'letter-spacing="1" fill="var(--fnt)">' + (h.day || '').toUpperCase() + '</text>').join('');
  svg.innerHTML =
    '<path d="' + area + '" fill="var(--acc-sf)"/>' + base +
    '<path d="' + path + '" fill="none" stroke="var(--acc)" stroke-width="1.8" ' +
      'stroke-linecap="round" stroke-linejoin="round"/>' + dots + wl + days;
  drawIn(svg);
}

// ---- charging page: live state + charge curve + stats + history ----
function renderChg(){

  const cur = S.currency ? S.currency.symbol : '';
  const sech = t => '<div class="sech" style="padding-left:0;padding-right:0"><span class="ov">' + t + '</span></div>';
  // charge-curve section between the live/last panel and the month stats — same slot as v1
  const curveHtml = s ?
    sech(s.ongoing ? 'Charge curve · live' : 'Last charge · ' + s.start_dt) +
    '<div class="panel"><svg id="cchart" viewBox="0 0 340 160"></svg>' +
    '<div class="cstats">' +
      '<div><b class="num">' + (s.dur_min != null ? s.dur_min + 'm' : '—') + '</b><span>duration</span></div>' +
      '<div><b class="num">' + (s.kwh != null ? s.kwh : '—') + '</b><span>kWh in</span></div>' +
      '<div><b class="num">' + (s.avg_kw != null ? s.avg_kw : '—') + '</b><span>avg kW</span></div>' +
      '<div><b class="num">' + (s.peak_kw != null ? s.peak_kw : '—') + '</b><span>peak kW</span></div>' +
    '</div>' +
    '<div class="crange">' + s.soc0 + '% → ' + s.soc1 + '% · ' + s.kwh + ' kWh into battery' +
      (s.kwh_billed != null ? ' (~' + s.kwh_billed + ' billed)' : '') +
      (s.cost != null ? ' · ' + cur + Number(s.cost).toLocaleString() : '') + '</div></div>' : '';
  let top;
  if(c.active){
    top = '<div class="panel"><div class="plbl">Charging now' + (c.mode ? ' · ' + c.mode.toUpperCase() : '') +
      '</div><div class="pval num">' + (c.rate_kw != null ? c.rate_kw : '—') + '<span class="u">kW</span></div>' +
      '<div class="stats"><div><b class="num">' +
        (c.remaining_min != null ? c.remaining_min + ' min' : '—') + '</b><span>time left</span></div>' +
      '<div><b class="num">' + (c.soc != null ? c.soc + '%' : '—') + '</b><span>started at</span></div></div></div>';
  } else {
    const last = (c.history || [])[0];
    top = '<div class="panel"><div class="plbl">Not charging</div>' +
      (last ? '<div class="pval num">' + last.kwh + '<span class="u">kWh last session</span></div>' +
        '<div class="stats"><div><b>' + last.dt + '</b><span>finished</span></div>' +
        '<div><b class="num">' + last.soc0 + '→' + last.soc1 + '%</b><span>SoC</span></div>' +
        '<div><b class="num">' + last.avg_kw + ' kW</b><span>avg</span></div></div>'
      : '<div class="pval num">—</div>') + '</div>';
  }
  const hist = (c.history || []).map(x =>
    '<div class="hrow2"><span>' + x.dt + '</span><span><b class="num">' + x.kwh + ' kWh</b> · ' +
    x.dur_min + ' min · ' + cur + Number(x.cost).toLocaleString() + '</span></div>').join('');
  el.innerHTML = top + curveHtml +
    sech('This month') +
    '<div class="panel"><div class="stats" style="border-top:0;padding-top:0;margin-top:0">' +
      '<div><b class="num">' + (c.month_kwh || 0) + '</b><span>kWh in</span></div>' +
      '<div><b class="num">' + (c.month || 0) + '</b><span>sessions</span></div>' +
      '<div><b class="num">' + cur + Number(c.month_cost || 0).toLocaleString() + '</b><span>cost</span></div>' +
      '</div></div>' +
    sech('History') +
    '<div class="panel">' + (hist || '<div class="plbl">No sessions logged yet</div>') + '</div>';

// charge curve (SoC% vs elapsed minutes) — same math as v1's drawCharge, instrument tokens
function drawChgCurve(s){
  const svg = $('cchart'); if(!svg) return;
  if(!s.series || s.series.length < 2){ svg.innerHTML = ''; return; }
  const W = 340, H = 160, L = 30, R = 12, T = 12, B = 24;
  const ys = s.series.map(p => p.soc), xmax = Math.max(...s.series.map(p => p.m), 1);
  let ymin = Math.max(0, Math.min(...ys) - 3), ymax = Math.min(100, Math.max(...ys) + 3);
  if(ymax - ymin < 6) ymax = Math.min(100, ymin + 6);
  const X = m => L + (m / xmax) * (W - L - R), Y = v => T + (1 - (v - ymin) / (ymax - ymin)) * (H - T - B);
  const pl = s.series.map(p => X(p.m).toFixed(1) + ',' + Y(p.soc).toFixed(1));
  let g = '';
  [ymin, (ymin + ymax) / 2, ymax].forEach(v => { const y = Y(v).toFixed(1);
    g += '<line x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y +
      '" stroke="var(--hair)" stroke-width="1"/>' +
      '<text x="' + (L - 7) + '" y="' + (+y + 3).toFixed(1) + '" text-anchor="end" font-size="9" fill="var(--fnt)">' +
      Math.round(v) + '</text>'; });
  g += '<text x="' + X(0).toFixed(1) + '" y="' + (H - 7) + '" font-size="8.5" letter-spacing="1" fill="var(--fnt)">0M</text>';
  g += '<text x="' + (W - R) + '" y="' + (H - 7) + '" text-anchor="end" font-size="8.5" letter-spacing="1" fill="var(--fnt)">' +
    Math.round(xmax) + 'M</text>';
  g += '<path d="M ' + X(0).toFixed(1) + ',' + (H - B) + ' L ' + pl.join(' L ') + ' L ' +
    X(xmax).toFixed(1) + ',' + (H - B) + ' Z" fill="var(--acc-sf)"/>';
  g += '<polyline points="' + pl.join(' ') + '" fill="none" stroke="var(--acc)" stroke-width="2" ' +
    'stroke-linejoin="round" stroke-linecap="round"/>';
  const lp = s.series[s.series.length - 1];
  g += '<circle cx="' + X(lp.m).toFixed(1) + '" cy="' + Y(lp.soc).toFixed(1) + '" r="3" fill="var(--acc)"/>';
  svg.innerHTML = g;
  drawIn(svg);
}

// ---- distance page: monthly calendar (same /api/history as v1's calendar view) ----
let calMonth = null;   // 'YYYY-MM'
const MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
async function renderDist(){
  const el = $('pgDistBody');
  if(!calMonth){
    const n = new Date();
    calMonth = n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0');
  }
  const [cy, cm] = calMonth.split('-').map(Number);
  const nav = d => '<svg viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="1.9" ' +
    'stroke-linecap="round" stroke-linejoin="round"><path d="' + (d < 0 ? 'M7 1L1 7l6 6' : 'M1 1l6 6-6 6') + '"/></svg>';
  el.innerHTML = '<div class="calhead">' +
    '<button class="calnav" id="calP" aria-label="Previous month">' + nav(-1) + '</button>' +
    '<b>' + MON[cm - 1] + ' ' + cy + '</b>' +
    '<button class="calnav" id="calN" aria-label="Next month">' + nav(1) + '</button></div>' +
    '<div class="calgrid" id="calG"><div class="note" style="margin:0">Loading…</div></div>';
  $('calP').onclick = () => { shiftMonth(-1); };
  $('calN').onclick = () => { shiftMonth(1); };
  const d = await api('/api/history?month=' + calMonth);
  const g = $('calG');
  const lead = (new Date(cy, cm - 1, 1).getDay() + 6) % 7;   // Monday-first
  const maxKm = Math.max(1, ...d.days.map(x => x.km));
  let cells = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map(x =>
    '<div class="caldow">' + x + '</div>').join('');
  for(let i = 0; i < lead; i++) cells += '<div></div>';
  d.days.forEach(x => {
    const has = x.km > 0;
    const op = has ? (0.35 + 0.65 * x.km / maxKm) : 0;
    cells += '<button class="calday ' + (has ? 'on' : 'off') + '" data-d="' + x.d + '">' +
      (op ? '<span class="calwash" style="opacity:' + (op * 0.16).toFixed(2) + '"></span>' : '') +
      '<span class="cd">' + x.d + '</span>' +
      '<span class="ck" style="opacity:' + (has ? 1 : 0.4) + '">' + (has ? x.km : '·') + '</span>' +
      (x.chg_kwh > 0 ? '<i class="cdot"></i>' : '') +
      '</button>';
  });
  g.innerHTML = cells;
  g.querySelectorAll('.calday.on').forEach(b => b.onclick = () => {
    const x = d.days.find(v => v.d == b.dataset.d);
    if(x) toast(MON[cm - 1] + ' ' + x.d + ': ' + x.km + ' km · ' + x.kwh + ' kWh' +
      (x.chg_kwh ? ' · +' + x.chg_kwh + ' kWh charged' : ''));
  });
  const t = d.totals || {};
  el.insertAdjacentHTML('beforeend',
    '<div class="caltot">' +
    '<div><b class="num">' + (t.km || 0) + '</b><span>km driven</span></div>' +
    '<div><b class="num">' + (t.kwh || 0) + '</b><span>kWh used</span></div>' +
    '<div><b class="num">' + (t.chg_kwh || 0) + '</b><span>kWh charged</span></div></div>');
}
function shiftMonth(dir){
  const [y, m] = calMonth.split('-').map(Number);
  const n = new Date(y, m - 1 + dir, 1);
  calMonth = n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0');
  renderDist();
}

// ---- account tab ----
let vinShown = false;
function renderAcct(){
  $('aModel').textContent = (S.vehicle && S.vehicle.model) || 'My car';
  const vin = (S.vehicle && S.vehicle.vin) || '';
  $('aVin').textContent = vin ? (vinShown ? vin : 'VIN ' + vin.slice(0, 3) + '…' + vin.slice(-3)) : '';

      '>' + o[1] + '</button>').join('') + '</span></div>';

  const linkRows = [
    {ic: 'gauge',  t: 'Classic dashboard', s: 'Trips, SPKLU planner, full stats', fn: () => location.href = '/index.html'},
    {ic: 'chart',  t: 'Share card',        s: 'Month stats as a shareable card',  fn: () => openPage('flex')},
    {ic: 'camera', t: 'Update car photo',  s: 'Re-fetch the render from CarLinko', fn: async () => {
        const d = await api('/api/photorefresh', {method: 'POST'});
        toast(d.ok ? 'Photo updated' : (d.error || 'failed')); if(d.ok) load(); }},
    {ic: 'link',   t: 'About', s: 'J5 EV Dashboard V2 · self-hosted', fn: () =>
        toast('J5 EV Dashboard V2 · CarLinko, reverse-engineered')},
  ];

  $('acctRows').innerHTML =
    segRow('moon', 'Appearance', 'th', [['auto', 'Auto'], ['light', 'Light'], ['dark', 'Dark']], th) +
    segRow('car', 'Default view', 'ui', [['v1', 'Classic'], ['v2', 'V2']], ui) +
    linkRows.map((r, i) =>
      '<button class="row" data-r="' + i + '"><span class="ri">' + icon(r.ic) + '</span>' +
      '<span class="rl">' + r.t + (r.s ? '<small>' + r.s + '</small>' : '') + '</span>' + CHEV + '</button>').join('');

  linkRows.forEach((r, i) => $('acctRows').querySelector('[data-r="' + i + '"]').onclick = r.fn);
  $('acctRows').querySelectorAll('[data-th]').forEach(b => b.onclick = () => {
    setTheme(b.dataset.th); renderAcct();
  });
  $('acctRows').querySelectorAll('[data-ui]').forEach(b => b.onclick = () => {
    document.cookie = 'ui=' + b.dataset.ui + ';path=/;max-age=31536000';
    renderAcct();
    if(b.dataset.ui === 'v1') toast('Classic will open from the app icon');
  });
  $('aNote').textContent = 'Data source: your own CarLinko account, self-hosted. Nothing leaves this server.';
}

// ---- navigation: two tabs + right-slide pages, now with back gesture and history ----
const PAGES = {ac: ['pgAc', renderAc], doors: ['pgDoors', renderDoors],
               tyres: ['pgTyres', renderTyres], energy: ['pgEnergy', renderEnergy],
               batt: ['pgBatt', renderBatt], chg: ['pgChg', renderChg],
               dist: ['pgDist', renderDist], flex: ['pgFlex', renderFlex]};
let openKey = null;

function openPage(k, fromHistory){
  const p = PAGES[k]; if(!p) return;
  if(k === 'ac' && CAPS && CAPS.ac && CAPS.ac.min != null)
    acTarget = Math.min(Math.max(acTarget, Math.ceil(CAPS.ac.min)), Math.floor(CAPS.ac.max));
  p[1]();
  const el = $(p[0]);
  el.scrollTop = 0;
  el.classList.add('open');
  // the page slides in; its contents rise a beat behind it so the two read as one move
  stagger([...el.querySelectorAll('.pbody > *')], 30, 150);
  openKey = k;
  if(!fromHistory) history.pushState({page: k}, '', '#' + k);
}
function closePage(fromHistory){
  if(!openKey) return;
  $(PAGES[openKey][0]).classList.remove('open');
  openKey = null;
  if(!fromHistory) history.back();
}
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => closePage());
window.addEventListener('popstate', ev => {
  const k = ev.state && ev.state.page;
  if(openKey && openKey !== k) closePage(true);
  if(k && k !== openKey) openPage(k, true);
});
document.addEventListener('keydown', ev => {
  if(ev.key !== 'Escape') return;
  if($('sheet').classList.contains('show')) askClose(false);
  else if(openKey) closePage();
});

// edge-swipe back on detail pages
(function(){
  let sx = 0, sy = 0, dragging = false, el = null, w = 0;
  document.addEventListener('touchstart', ev => {
    if(!openKey || ev.touches.length !== 1) return;
    const t = ev.touches[0];
    if(t.clientX > 30) return;
    el = $(PAGES[openKey][0]); w = el.offsetWidth || 430;
    sx = t.clientX; sy = t.clientY; dragging = true;
  }, {passive: true});
  document.addEventListener('touchmove', ev => {
    if(!dragging) return;
    const t = ev.touches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if(Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 14){ dragging = false; el.classList.remove('drag');
      el.style.transform = ''; return; }
    if(dx <= 0) return;
    el.classList.add('drag');
    el.style.transform = 'translate3d(' + dx + 'px,0,0)';
  }, {passive: true});
  document.addEventListener('touchend', ev => {
    if(!dragging) return;
    dragging = false;
    const dx = (ev.changedTouches[0].clientX - sx);
    el.classList.remove('drag');
    el.style.transform = '';
    if(dx > w * 0.32) closePage();
  }, {passive: true});
})();

document.querySelectorAll('.tabbar button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabbar button').forEach(x => x.classList.toggle('on', x === b));
  const home = b.dataset.v === 'home';
  const shown = home ? $('viewHome') : $('viewAcct');
  $('viewHome').hidden = !home; $('viewAcct').hidden = home;
  if(!home && !S._acctDone){ renderAcct(); S._acctDone = true; }
  shown.classList.remove('fadein'); void shown.offsetWidth; shown.classList.add('fadein');
  window.scrollTo(0, 0);
});

// ---- data ----
async function load(){
  try{
    S = await api('/api/summary');
    renderHero(); renderQA(); renderCharging(); renderCards();
    if(S._acctDone) renderAcct();
  }catch(e){ /* auth redirect handled in api() */ }
}
$('hRefresh').onclick = async () => {
  const b = $('hRefresh'); b.classList.add('spin');
  try{ await api('/api/refresh'); }catch(e){}
  await load(); b.classList.remove('spin');
};
$('aEye').onclick = () => { vinShown = !vinShown; renderAcct(); };

(async () => {
  try{ CAPS = (await api('/api/controls')).caps; }catch(e){ CAPS = null; }
  await load();
  // first paint only: the instrument comes up top-down, then the actions
  stagger([$('hModel').parentNode, $('hRange').parentNode, document.querySelector('.hlbl'),
           document.querySelector('.hmeta'), $('hCar')], 40, 0);
  stagger([...$('qaRow').children], 40, 200);
  const h = location.hash.slice(1);
  if(PAGES[h]) openPage(h);           // deep link: v2.html#doors / #tyres / #energy / #ac
  if(h === 'acct') document.querySelector('.tabbar button[data-v="acct"]').click();
  setInterval(() => { if(!document.hidden) load(); }, 60000);
})();
